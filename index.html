/* ============ BASE ============ */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-body);font-weight:600;margin:0;text-wrap:balance;color:var(--text);}
p{margin:0;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--accent-text);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
svg{width:16px;height:16px;flex-shrink:0;}
.hidden{display:none!important;}
::selection{background:var(--accent-soft);}

/* ============ LAYOUT SHELL ============ */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex:none;background:var(--surface);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow-sm);}
.brand-mark svg{width:18px;height:18px;stroke:#fff;}
.brand-name{font-weight:700;font-size:15.5px;letter-spacing:.1px;}
.brand-sub{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.09em;margin-top:1px;}

.role-chip{margin:0 14px 14px;padding:9px 11px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--border);}
.role-chip-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:6px;}
.role-switch{display:flex;gap:4px;}
.role-btn{flex:1;padding:6px 4px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--text-muted);font-size:11.5px;font-weight:600;cursor:pointer;text-align:center;}
.role-btn.active{background:var(--accent);color:#062825;}
.role-btn:not(.active):hover{background:var(--surface-3);}

.nav{flex:1;padding:4px 10px 14px;}
.nav-group{margin-top:14px;}
.nav-group:first-child{margin-top:2px;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);padding:0 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13.3px;font-weight:500;margin-bottom:1px;}
.nav-item svg{width:16px;height:16px;stroke:currentColor;flex:none;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600;}
.nav-item.nav-locked{opacity:.42;cursor:not-allowed;pointer-events:none;}

.sidebar-foot{padding:12px 14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.theme-toggle{margin-inline-start:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);}
.theme-toggle:hover{color:var(--text);}
.theme-toggle svg{width:15px;height:15px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 28px;background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
.topbar-title{font-size:16.5px;font-weight:700;}
.topbar-sub{font-size:12px;color:var(--text-faint);margin-top:1px;}
.topbar-right{margin-inline-start:auto;display:flex;align-items:center;gap:10px;}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:20px;background:var(--surface);border:1px solid var(--border);}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;}
.user-chip-name{font-size:12.3px;font-weight:600;}
.user-chip-role{font-size:10.5px;color:var(--text-faint);}

.content{padding:22px 28px 60px;max-width:1220px;width:100%;margin:0 auto;}
.page-lede{color:var(--text-muted);font-size:13.5px;margin-top:4px;max-width:640px;}

/* ============ PUBLIC SHELL (landing / pricing / login) ============ */
.public-shell{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}

.public-nav-link:hover{color:var(--text);}
.public-nav-link.active{color:var(--accent-text);}
.public-nav-right{margin-inline-start:auto;display:flex;align-items:center;gap:12px;}
.public-content{flex:1;}
.hero{padding:72px 32px 44px;text-align:center;max-width:720px;margin:0 auto;}
.hero h1{font-size:36px;line-height:1.18;margin-bottom:16px;}
.hero p{font-size:15.5px;color:var(--text-muted);margin-bottom:26px;}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.features-grid{max-width:1080px;margin:0 auto;padding:10px 32px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
.pricing-grid-public{max-width:1080px;margin:0 auto;padding:10px 32px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;}
.pricing-card-public{display:flex;flex-direction:column;}
.store-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;}
.store-item summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;flex-direction:column;gap:7px;}
.store-item summary::-webkit-details-marker{display:none;}
.store-item summary::marker{content:"";}
.store-item summary:hover{background:var(--surface-2);}
.store-item-name{font-weight:700;font-size:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.store-item-name .chev{color:var(--text-faint);transition:transform .15s;flex:none;}
.store-item details[open] .chev{transform:rotate(180deg);}
.store-item-price{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;}
.store-item details[open] summary{border-bottom:1px solid var(--border);}
.store-item-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px;}
.store-cart{padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.store-cart.has{background:var(--accent-soft);}
.store-stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);}
.store-stepper button{width:34px;height:32px;border:none;background:transparent;font-size:17px;font-weight:600;color:var(--text-muted);cursor:pointer;}
.store-stepper button:hover{background:var(--surface-2);color:var(--text);}
.store-stepper .n{min-width:26px;text-align:center;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;}
.store-cart-bar{position:sticky;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -6px 20px -10px rgba(0,0,0,.28);}
.public-footer{padding:24px 32px;border-top:1px solid var(--border);text-align:center;color:var(--text-faint);font-size:12px;}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px;box-shadow:var(--shadow-md);}

/* ================================================================
   AQ-PUB — pages publiques : thème sombre "eau profonde"
   Entièrement isolé sous .aq-pub : ne touche jamais l'app connectée.
   ================================================================ */
.aq-pub{
  --aq-abyss:#04191d; --aq-deep:#031216; --aq-kelp:#0b2f33; --aq-kelp-2:#0f3b3f;
  --aq-line:rgba(160,236,224,.14); --aq-line-soft:rgba(160,236,224,.08);
  --aq-white:#ffffff; --aq-mist:#e9fbf8; --aq-silver:#a4bdbc; --aq-faint:#6f8988;
  --aq-glow:#d7fff2; --aq-accent:#25d3bd;
  --aq-grad:linear-gradient(100deg,#0fbfa8 0%,#7ff0dd 48%,#c7bcff 100%);
  --aq-grad-soft:linear-gradient(120deg,rgba(37,211,189,.16),rgba(199,188,255,.12));
  background:var(--aq-abyss); color:var(--aq-silver);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
.aq-pub ::selection{background:rgba(127,240,221,.28);color:#fff;}
.aq-pub .aq-wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
.aq-pub .aq-eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--aq-accent);display:inline-block;}
.aq-pub h1,.aq-pub h2,.aq-pub h3{color:var(--aq-white);font-weight:500;letter-spacing:-.02em;line-height:1.05;margin:0;}
.aq-pub h1{font-size:clamp(2.6rem,6vw,4.4rem);letter-spacing:-.035em;}
.aq-pub h2{font-size:clamp(1.9rem,3.6vw,2.9rem);letter-spacing:-.03em;}
.aq-pub h3{font-size:1.15rem;letter-spacing:-.01em;}
.aq-pub p{line-height:1.62;margin:0;}

/* nav */
.aq-pub .aq-nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:30px;
  padding:16px 28px;background:color-mix(in srgb,var(--aq-abyss) 78%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--aq-line-soft);}
.aq-pub .aq-brand{display:flex;align-items:center;gap:8px;cursor:pointer;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--aq-white);font-weight:500;font-size:16.5px;letter-spacing:-.035em;
  text-shadow:0 0 24px rgba(127,240,221,.20);}
.aq-pub .aq-brand .brand-mark{width:15px;height:15px;background:none;border-radius:0;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 5px rgba(127,240,221,.6));}
.aq-pub .aq-brand .brand-mark svg{width:15px;height:15px;stroke:var(--aq-glow);stroke-width:1.6;fill:none;}
.aq-pub .aq-nav-links{display:flex;gap:24px;}
.aq-pub .aq-nav-link{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--aq-silver);cursor:pointer;transition:color .15s;}
.aq-pub .aq-nav-link:hover,.aq-pub .aq-nav-link.active{color:var(--aq-white);}
.aq-pub .aq-nav-right{margin-inline-start:auto;display:flex;align-items:center;gap:14px;}
.aq-pub .aq-nav-toggle{display:none;width:38px;height:38px;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--aq-line);border-radius:9px;color:var(--aq-white);cursor:pointer;}
.aq-pub .aq-nav-toggle svg{width:18px;height:18px;stroke:currentColor;}

/* buttons */
.aq-pub .aq-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:8px;border:1px solid var(--aq-line);background:transparent;
  color:var(--aq-white);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s;}
.aq-pub .aq-btn:hover{background:var(--aq-kelp);border-color:transparent;}
.aq-pub .aq-btn svg{width:14px;height:14px;}
.aq-pub .aq-btn-primary{background:var(--aq-grad);border-color:transparent;color:#04231f;background-size:160% 160%;}
.aq-pub .aq-btn-primary:hover{background-position:100% 0;transform:translateY(-1px);}
.aq-pub .aq-btn-sm{padding:9px 15px;}
.aq-pub .aq-btn-lg{padding:16px 28px;font-size:12.5px;}

/* hero */
.aq-pub .aq-hero{position:relative;overflow:hidden;padding:96px 0 92px;isolation:isolate;}
.aq-pub .aq-hero-inner{position:relative;z-index:2;max-width:840px;margin:0 auto;padding:0 28px;text-align:center;}
.aq-pub .aq-hero h1{margin:18px 0 20px;}
.aq-pub .aq-hero p{font-size:clamp(1rem,1.6vw,1.2rem);color:var(--aq-mist);max-width:620px;margin:0 auto 34px;}
.aq-pub .aq-hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.aq-pub .aq-hero-note{margin-top:20px;font-size:12px;color:var(--aq-faint);letter-spacing:.04em;}
/* animated water backdrop */
.aq-pub .aq-hero-media{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.aq-pub .aq-hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1.4s ease;filter:saturate(.7);}
.aq-pub .aq-hero-video.ready{opacity:.9;}
.aq-pub .aq-hero-tint{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(58% 58% at 50% 32%,rgba(37,211,189,.20),transparent 72%),
    linear-gradient(180deg,rgba(4,25,29,.55) 0%,rgba(4,25,29,.78) 62%,var(--aq-abyss) 100%),
    linear-gradient(115deg,rgba(15,191,168,.22),rgba(199,188,255,.12) 60%,transparent);}
.aq-pub .aq-caustics{position:absolute;inset:-25% -10%;z-index:0;pointer-events:none;
  background:
    radial-gradient(42% 55% at 22% 28%,rgba(37,211,189,.22),transparent 70%),
    radial-gradient(46% 60% at 82% 22%,rgba(199,188,255,.18),transparent 72%),
    radial-gradient(60% 70% at 62% 92%,rgba(15,191,168,.16),transparent 70%);
  filter:blur(30px);animation:aqDrift 22s ease-in-out infinite alternate;}
.aq-pub .aq-shafts{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(103deg,transparent 0 46px,rgba(215,255,242,.05) 46px 48px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 55%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 12%,#000 55%,transparent);
  animation:aqShaft 18s linear infinite;}
.aq-pub .aq-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:180px;z-index:1;
  background:linear-gradient(180deg,transparent,var(--aq-abyss));pointer-events:none;}
@keyframes aqDrift{0%{transform:translate3d(-3%,-2%,0) scale(1.05)}100%{transform:translate3d(4%,3%,0) scale(1.12)}}
@keyframes aqShaft{0%{background-position:0 0}100%{background-position:520px 0}}
@keyframes slideIn{0%{transform:translateX(400px);opacity:0}100%{transform:translateX(0);opacity:1}}

/* generic public section */
.aq-pub .aq-section{padding:76px 0;border-top:1px solid var(--aq-line-soft);}
.aq-pub .aq-section-head{max-width:640px;margin:0 auto 44px;text-align:center;}
.aq-pub .aq-section-head h2{margin:14px 0 12px;}
.aq-pub .aq-section-head p{color:var(--aq-silver);}

/* cards / surface stack */
.aq-pub .aq-card{background:var(--aq-kelp);border:1px solid var(--aq-line-soft);border-radius:16px;padding:26px;min-width:0;}
.aq-pub .aq-card--deep{background:var(--aq-deep);}
.aq-pub .aq-grid{display:grid;gap:16px;}
.aq-pub .aq-grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.aq-pub .aq-grid-4{grid-template-columns:repeat(2,1fr);}
@media (min-width:1000px){ .aq-pub .aq-grid-4{grid-template-columns:repeat(4,1fr);} }
.aq-pub .aq-grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.aq-pub .aq-feat .aq-ic{width:38px;height:38px;border-radius:9px;background:var(--aq-grad-soft);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.aq-pub .aq-feat .aq-ic svg{width:18px;height:18px;stroke:var(--aq-glow);}
.aq-pub .aq-feat h3{margin-bottom:8px;}
.aq-pub .aq-feat p{font-size:13.5px;color:var(--aq-silver);}

/* stats */
.aq-pub .aq-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;text-align:center;}
.aq-pub .aq-stat b{display:block;font-size:clamp(2rem,4vw,3rem);font-weight:500;color:var(--aq-glow);letter-spacing:-.03em;line-height:1;}
.aq-pub .aq-stat span{display:block;margin-top:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--aq-mist);}

/* pricing */

.aq-pub .aq-price-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:stretch;}
.aq-pub .aq-price{display:flex;flex-direction:column;background:var(--aq-kelp);border:1px solid var(--aq-line-soft);border-radius:14px;padding:18px 16px;min-width:0;}
.aq-pub .aq-price.feat{border-color:transparent;background:linear-gradient(180deg,var(--aq-kelp-2),var(--aq-kelp));box-shadow:0 0 0 1px rgba(127,240,221,.35),0 24px 50px -28px rgba(37,211,189,.4);}
.aq-pub .aq-price .aq-price-name{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--aq-white);}
.aq-pub .aq-price .aq-price-tag{margin:12px 0 3px;line-height:1.15;}
.aq-pub .aq-price .aq-price-tag b{font-size:24px;font-weight:500;color:var(--aq-white);letter-spacing:-.02em;}
.aq-pub .aq-price .aq-price-tag span{font-size:11px;color:var(--aq-faint);}
.aq-pub .aq-price ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;}
.aq-pub .aq-price li{display:flex;gap:7px;font-size:11.7px;color:var(--aq-silver);line-height:1.4;}
.aq-pub .aq-price li svg{width:13px;height:13px;stroke:var(--aq-accent);flex:none;margin-top:2px;}
.aq-pub .aq-price .aq-btn{margin-top:16px;width:100%;padding:11px 12px;font-size:10.5px;letter-spacing:.06em;}
.aq-pub .aq-badge-trial{display:block;margin-bottom:2px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--aq-glow);}
@media (max-width:1080px){ .aq-pub .aq-price-grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
@media (max-width:720px){ .aq-pub .aq-price-grid{grid-template-columns:1fr;} }

/* auth + forms on dark */
.aq-pub .aq-authwrap{display:flex;align-items:center;justify-content:center;padding:64px 20px;min-height:70vh;}
.aq-pub .aq-authcard{width:100%;max-width:420px;background:var(--aq-kelp);border:1px solid var(--aq-line-soft);border-radius:18px;padding:32px;}
.aq-pub .aq-authcard.wide{max-width:460px;}
.aq-pub .aq-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.aq-pub .aq-field label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--aq-silver);}
.aq-pub .aq-field .help{font-size:11px;color:var(--aq-faint);text-transform:none;letter-spacing:0;}
.aq-pub .aq-input{width:100%;background:var(--aq-deep);border:1px solid var(--aq-line);border-radius:9px;
  padding:11px 13px;color:var(--aq-white);font-family:inherit;font-size:14px;}
.aq-pub .aq-input:focus{outline:none;border-color:var(--aq-accent);box-shadow:0 0 0 3px rgba(37,211,189,.15);}
.aq-pub textarea.aq-input{resize:vertical;min-height:120px;}
.aq-pub select.aq-input{appearance:none;}
.aq-pub .aq-note{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.5;
  background:var(--aq-grad-soft);border:1px solid var(--aq-line-soft);color:var(--aq-mist);margin-bottom:16px;}
.aq-pub .aq-note svg{width:15px;height:15px;stroke:var(--aq-glow);flex:none;margin-top:1px;}
.aq-pub .aq-note.bad{background:rgba(194,45,74,.14);border-color:rgba(194,45,74,.3);}
.aq-pub .aq-link{color:var(--aq-glow);font-weight:600;cursor:pointer;}
.aq-pub .aq-muted-link{color:var(--aq-silver);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

/* docs / legal prose */
.aq-pub .aq-prose{max-width:760px;margin:0 auto;}
.aq-pub .aq-prose h2{margin:44px 0 14px;font-size:1.5rem;}
.aq-pub .aq-prose h3{margin:26px 0 8px;color:var(--aq-mist);}
.aq-pub .aq-prose p,.aq-pub .aq-prose li{color:var(--aq-silver);font-size:14.5px;line-height:1.68;}
.aq-pub .aq-prose ul,.aq-pub .aq-prose ol{margin:10px 0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;}
.aq-pub .aq-prose strong{color:var(--aq-white);font-weight:600;}
.aq-pub .aq-prose a{color:var(--aq-glow);}
.aq-pub .aq-toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px;}
.aq-pub .aq-toc a{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--aq-silver);
  border:1px solid var(--aq-line-soft);border-radius:999px;padding:6px 13px;cursor:pointer;}
.aq-pub .aq-toc a:hover{color:var(--aq-white);border-color:var(--aq-accent);}
.aq-pub .aq-doc-plan{border:1px solid var(--aq-line-soft);border-radius:16px;padding:24px;margin-bottom:16px;background:var(--aq-kelp);}
.aq-pub .aq-doc-plan h3{color:var(--aq-white);margin:0 0 4px;}
.aq-pub .aq-doc-plan .aq-doc-price{font-size:12px;color:var(--aq-accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;display:block;}

/* footer */
.aq-pub .aq-footer{background:var(--aq-deep);border-top:1px solid var(--aq-line-soft);padding:56px 0 30px;}
.aq-pub .aq-footer-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:30px;}
.aq-pub .aq-footer h4{color:var(--aq-white);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;font-weight:600;}
.aq-pub .aq-footer a{display:block;color:var(--aq-silver);font-size:13px;cursor:pointer;margin-bottom:9px;}
.aq-pub .aq-footer a:hover{color:var(--aq-white);}
.aq-pub .aq-footer-bar{max-width:1180px;margin:38px auto 0;padding:22px 28px 0;border-top:1px solid var(--aq-line-soft);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--aq-faint);letter-spacing:.03em;}

/* scroll reveal */
.aq-pub .aq-reveal{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease;}
.aq-pub .aq-reveal.in{opacity:1;transform:none;}

/* --- Tablette --- */
@media (max-width:900px){
  .aq-pub .aq-footer-grid{grid-template-columns:1fr 1fr;}
}
/* --- Menu mobile (hamburger) --- */
@media (max-width:820px){
  .aq-pub .aq-nav{gap:14px;padding:14px 18px;position:relative;}
  .aq-pub .aq-nav-toggle{display:flex;}
  .aq-pub .aq-nav-right{gap:10px;}
  .aq-pub .aq-nav-links{
    display:none;position:absolute;top:100%;left:0;right:0;
    flex-direction:column;gap:0;padding:6px 0;
    background:var(--aq-deep);border-bottom:1px solid var(--aq-line);
    box-shadow:0 24px 40px -16px rgba(0,0,0,.6);}
  .aq-pub .aq-nav.open .aq-nav-links{display:flex;}
  .aq-pub .aq-nav.open .aq-nav-links .aq-nav-link{padding:13px 20px;font-size:12.5px;border-bottom:1px solid var(--aq-line-soft);}
  .aq-pub .aq-nav.open .aq-nav-links .aq-nav-link:last-child{border-bottom:none;}
}
/* --- Téléphone --- */
@media (max-width:560px){
  .aq-pub .aq-wrap,.aq-pub .aq-hero-inner,.aq-pub .aq-price-wrap{padding-left:18px;padding-right:18px;}
  .aq-pub .aq-hero{padding:64px 0 60px;}
  .aq-pub .aq-hero h1{font-size:clamp(2.1rem,8.4vw,2.7rem);}
  .aq-pub .aq-hero p{font-size:1rem;}
  .aq-pub .aq-hero-cta{flex-direction:column;}
  .aq-pub .aq-hero-cta .aq-btn{width:100%;}
  .aq-pub .aq-section{padding:52px 0;}
  .aq-pub .aq-section-head{margin-bottom:32px;}
  .aq-pub h2{font-size:clamp(1.6rem,6.4vw,2rem);}
  .aq-pub .aq-stats{grid-template-columns:1fr 1fr;gap:18px 14px;}
  .aq-pub .aq-grid-4,.aq-pub .aq-grid-3,.aq-pub .aq-grid-2{grid-template-columns:1fr;}
  .aq-pub .aq-footer{padding:44px 0 26px;}
  .aq-pub .aq-footer-grid{grid-template-columns:1fr;gap:26px;}
  .aq-pub .aq-footer-bar{flex-direction:column;gap:8px;text-align:center;}
  .aq-pub .aq-authcard{padding:24px 20px;}
  .aq-pub .aq-prose h2{margin-top:34px;}
  .aq-pub .aq-toc{gap:6px;}
}
@media (prefers-reduced-motion:reduce){
  .aq-pub .aq-caustics,.aq-pub .aq-shafts{animation:none;}
  .aq-pub .aq-reveal{opacity:1;transform:none;transition:none;}
}

/* ============ COMPONENTS ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);min-width:0;}
.card-title{font-size:14.5px;font-weight:700;}
.card-sub{font-size:12px;color:var(--text-faint);margin-top:2px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:1.1fr .9fr;}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

/* Autocomplete du catalogue sur les champs "Produit" des lignes de devis/CPS.
   La liste est volontairement plus large que le champ : la colonne "Produit" du
   tableau est étroite (150px) et un nom de catalogue complet ne tiendrait pas
   dedans, on préfère l'élargir plutôt que de tronquer un nom illisible.
   position:fixed (positionné en JS, voir positionAutocompleteList) plutôt
   qu'absolute : le champ vit dans .table-wrap, qui a overflow-x:auto — et un
   axe non-visible force l'autre à cliper aussi (spec CSS), donc une liste en
   position:absolute s'y retrouvait tronquée sur la droite dès qu'elle dépassait
   la largeur visible du tableau. position:fixed échappe à ce clip d'ancêtre. */
.ac-wrap{position:relative;}
.ac-list{position:fixed;min-width:160px;width:max-content;max-width:min(360px,90vw);
  z-index:30;max-height:220px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);}
.ac-item{padding:8px 10px;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;}
.ac-item:hover,.ac-item.active{background:var(--surface-2);}
.ac-item-nom{white-space:normal;word-break:break-word;}
.ac-item-meta{color:var(--text-faint);font-family:var(--font-mono);font-size:11px;}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);}
.kpi-label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.kpi-value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-.02em;}
.kpi-delta{font-size:11.5px;margin-top:6px;font-weight:600;}
.kpi-delta.up{color:var(--success);}
.kpi-delta.down{color:var(--danger);}
.kpi-delta.flat{color:var(--text-faint);}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px;gap:12px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:15px;}
.section-head .hint{font-size:12px;color:var(--text-faint);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.01em;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.ok{background:var(--success-soft);color:var(--success);}
.badge.warn{background:var(--warning-soft);color:var(--warning);}
.badge.bad{background:var(--danger-soft);color:var(--danger);}
.badge.neutral{background:var(--surface-3);color:var(--text-muted);}
.badge.accent{background:var(--accent-soft);color:var(--accent-text);}
.badge-x{width:11px;height:11px;flex:none;}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13px;}
.table-wrap table{min-width:560px;}
thead th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.row-active{background:var(--accent-soft);}
td.num,th.num{text-align:end;font-family:var(--font-mono);}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;}
.btn svg{width:14px;height:14px;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#04231f;}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
.btn-danger-outline{border-color:var(--danger);color:var(--danger);background:transparent;}
.btn-danger-outline:hover{background:var(--danger-soft);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:600;color:var(--text-muted);}
.field .help{font-size:11px;color:var(--text-faint);}
.input,select.input,textarea.input{
  width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13.3px;
}
textarea.input{resize:vertical;min-height:64px;font-family:var(--font-body);}
.input:focus,select.input:focus,textarea.input:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--surface);}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.input-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media (max-width:640px){.input-row,.input-row3{grid-template-columns:1fr;}}
.form-grid{display:flex;flex-direction:column;gap:14px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);font-weight:500;}
.checkline input{width:15px;height:15px;accent-color:var(--accent);}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.seg button{flex:1;padding:8px 10px;background:var(--surface-2);border:none;border-inline-end:1px solid var(--border);font-size:12.6px;font-weight:600;color:var(--text-muted);cursor:pointer;}
.seg button:last-child{border-inline-end:none;}
.seg button.active{background:var(--accent);color:#04231f;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--text-muted);}
.tab.active{color:var(--accent-text);border-bottom-color:var(--accent);}

.metric-tile{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:13px 14px;}
.metric-tile .l{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.metric-tile .v{font-family:var(--font-mono);font-size:19px;font-weight:600;margin-top:5px;}
.metric-tile .u{font-size:11px;color:var(--text-faint);margin-inline-start:3px;font-weight:500;}
.metric-tile .n{font-size:11.5px;color:var(--text-muted);margin-top:4px;}

.gauge-wrap{display:flex;align-items:center;gap:14px;}
.gauge-track{flex:1;height:8px;border-radius:6px;background:var(--surface-3);position:relative;overflow:visible;}
.gauge-fill{height:100%;border-radius:6px;}
.gauge-zone{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--border);}

.callout{display:flex;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size:12.6px;color:var(--text-muted);}
.callout svg{width:16px;height:16px;flex:none;margin-top:1px;}
.callout.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-text);}
.callout.warn{background:var(--warning-soft);border-color:transparent;color:var(--warning);}
.callout.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger);}
.callout.ok{background:var(--success-soft);border-color:transparent;color:var(--success);}
.callout b{color:inherit;}

.divider{height:1px;background:var(--border);margin:18px 0;}
.empty{padding:34px 20px;text-align:center;color:var(--text-faint);font-size:13px;}
.empty svg{width:26px;height:26px;margin-bottom:8px;stroke:var(--text-faint);}

.result-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:18px;}
.result-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.result-head .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex:none;}
.result-head .ic svg{width:15px;height:15px;}

.chk-add{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-size:12.6px;margin-bottom:6px;}
.chk-add input{accent-color:var(--accent);width:14px;height:14px;}
.chk-add .nm{flex:1;font-weight:600;}
.chk-add .qt{width:64px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-family:var(--font-mono);text-align:end;font-size:12px;}
.chk-add .un{color:var(--text-faint);width:36px;font-size:11.5px;}

.sticky-note{position:sticky;top:80px;}

/* Quote sheet */
.quote-sheet{background:#fff;color:#16212a;border-radius:12px;border:1px solid var(--border);padding:34px 36px;font-size:12.7px;overflow-x:auto;}
.quote-sheet *{color:inherit;}
.quote-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:2px solid #16212a;padding-bottom:16px;}
.quote-logo{max-height:54px;max-width:180px;object-fit:contain;}
.quote-head h1{font-size:19px;letter-spacing:-.01em;}
.quote-meta{text-align:end;font-family:var(--font-mono);font-size:11.5px;line-height:1.7;white-space:nowrap;}
.quote-parties{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;margin:18px 0;font-size:12px;}
.quote-parties .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#8698a0;font-weight:700;margin-bottom:4px;}
.quote-table{width:100%;min-width:480px;border-collapse:collapse;margin-top:6px;font-size:12px;}
.quote-table-wrap{overflow-x:auto;}
.quote-table th{text-align:start;font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid #16212a;padding:7px 6px;}
.quote-table td{padding:8px 6px;border-bottom:1px solid #dfe5e7;}
.quote-table td.num,.quote-table th.num{text-align:end;font-family:var(--font-mono);}
.quote-totals{margin-inline-start:auto;width:260px;margin-top:10px;font-size:12.3px;}
.quote-totals div{display:flex;justify-content:space-between;padding:5px 0;}
.quote-totals .ttc{font-weight:700;font-size:14.5px;border-top:1.5px solid #16212a;margin-top:4px;padding-top:8px;}
.quote-foot{margin-top:26px;padding-top:12px;border-top:1px solid #dfe5e7;font-size:10.5px;color:#8698a0;text-align:center;}
.cps-h{margin:22px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #dfe5e7;padding-bottom:5px;}
.cps-h:first-of-type{margin-top:14px;}
.cps-p{margin:0 0 10px;font-size:11.8px;line-height:1.65;}
.cps-ul,.cps-ol{margin:0 0 12px;padding-inline-start:20px;font-size:11.8px;line-height:1.7;}
.cps-ul li,.cps-ol li{margin-bottom:3px;}

@media screen{
  .print-only{position:absolute;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none;}
}
@media print{
  body *{visibility:hidden;}
  .print-area,.print-area *{visibility:visible;}
  .print-area{position:absolute;top:0;inset-inline-start:0;width:100%;border:none;border-radius:0;padding:0;}
}

.sidebar-close{display:none;}
.sidebar-scrim{display:none;}
@media (max-width:900px){
  .sidebar{position:fixed;inset-inline-start:0;top:0;transform:translateX(-100%);transition:transform .2s;z-index:20;box-shadow:var(--shadow-md);}
  [dir="rtl"] .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-close{display:flex;}
  .sidebar-scrim.show{display:block;position:fixed;inset:0;background:rgba(8,16,18,.45);z-index:15;}
  .content{padding:18px 16px 60px;}
  .topbar{padding:12px 16px;}
}
.menu-btn{display:none;}
@media (max-width:900px){.menu-btn{display:flex;}}

/* ============ RTL (Arabic) ============ */
[dir="rtl"] body{font-family:var(--font-body);}
.lang-switch{display:flex;gap:3px;margin-top:8px;}

<script>
"use strict";
/* =========================================================================
   AQUAAMAN — prototype interactif (démo, sans back-end)
   Toutes les données sont fictives et stockées dans le navigateur (localStorage).
   ========================================================================= */

/* ---------------- Utils ---------------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
const round0 = n=>Math.round(n);
const round1 = n=>Math.round(n*10)/10;
const round2 = n=>Math.round(n*100)/100;
const fmt = (n,d=0)=>{ const num=Number(n); return (isFinite(num)?num:0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}); };
// Wrapped in Unicode LRI/PDI isolate marks so the number+currency pair always renders
// in a stable left-to-right order even inside an Arabic (RTL) paragraph — otherwise the
// bidi algorithm reorders the two Latin "words" (amount, currency code) relative to each other.
const fmtMoney = (n,currency='MAD',d)=>{ const dec = d!=null? d : (currency==='MAD'?0:2); return '⁦'+fmt(n,dec)+' '+currency+'⁩'; };
const fmtKo = b=> b>=1048576 ? (b/1048576).toFixed(1)+' Mo' : Math.max(1,Math.round(b/1024))+' Ko';
// Converts a MAD amount into the document's chosen currency using the admin-editable,
// indicative fixed rates in STATE.exchangeRates (e.g. EUR:10.8 means 1 EUR = 10.8 MAD).
function convertMAD(amountMAD, currency){
  if(!currency || currency==='MAD') return amountMAD;
  const rate = parseFloat(STATE.exchangeRates && STATE.exchangeRates[currency]) || 1;
  return amountMAD / rate;
}
const uid = ()=> 'id'+Math.random().toString(36).slice(2,10);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Triggers the browser's native print (used for "Imprimer / Exporter en PDF").
// Some embedded/sandboxed viewing contexts silently block window.print() with no
// error and no dialog — we can't detect that from inside an iframe with certainty,
// so as a safety net we watch for the 'beforeprint' event and, if it never fires
// shortly after calling print(), reveal a hint telling the person how to work
// around it (open the page in its own full browser tab, which is never sandboxed).
function printNow(noteId){
  let fired = false;
  const onBefore = () => { fired = true; };
  window.addEventListener('beforeprint', onBefore, {once:true});
  try { window.print(); } catch(e) {}
  setTimeout(()=>{
    window.removeEventListener('beforeprint', onBefore);
    if(!fired){
      const note = document.getElementById(noteId || 'print-fallback-note');
      if(note) note.style.display='flex';
    }
  }, 450);
}

/* ---------------- Reference tables (formules standards du métier piscine) ---------------- */
// `media` = masse totale de média filtrant (kg) chargée dans le filtre.
const FILTERS = [
  {d:400, surface:0.126, media:100},
  {d:500, surface:0.196, media:150},
  {d:600, surface:0.283, media:250},
  {d:750, surface:0.442, media:400},
  {d:900, surface:0.636, media:600},
  {d:1050,surface:0.866, media:800},
];
const VITESSE_FILTRATION = 50; // m3/h par m² — vitesse indicative filtre à sable
// A sand filter is loaded in two layers: a quartz gravel support bed over the crépines
// (≈25% of the mass) and the main silica sand bed (≈75%). Quoted as two separate media.
const MEDIA_GRAVIER_PCT = 0.25;
function filterMedia(filtre){
  const totalKg = filtre.media;
  const gravierKg = round0(totalKg * MEDIA_GRAVIER_PCT);
  const siliceKg = totalKg - gravierKg;
  return {totalKg, gravierKg, siliceKg, gravierSacs:Math.ceil(gravierKg/25), siliceSacs:Math.ceil(siliceKg/25)};
}

const PUMPS = [
  {q:8,  cv:0.5,  kw:0.37, phase:'Mono'},
  {q:12, cv:0.75, kw:0.55, phase:'Mono'},
  {q:16, cv:1,    kw:0.75, phase:'Mono'},
  {q:20, cv:1.5,  kw:1.10, phase:'Mono/Tri'},
  {q:28, cv:2,    kw:1.50, phase:'Mono/Tri'},
  {q:40, cv:3,    kw:2.20, phase:'Tri conseillé'},
  {q:60, cv:5,    kw:3.70, phase:'Tri'},
];

const COP_PAC = 4.2; // coefficient de performance moyen pompe à chaleur air/eau

// pH and chlorine regulation are proposed either as two separate dosing stations or as one
// combined pH/Chlore unit (a single device that regulates both at once) — the combined option
// is offered alongside the separate ones and the person picks which to quote.
const REGULATEURS_PH = [
  {max:50,  nom:'Régulateur pH compact — mono-voie', debit:'1 – 2 L/h'},
  {max:100, nom:'Régulateur pH — bi-voies', debit:'3 – 5 L/h'},
  {max:250, nom:'Régulateur pH professionnel + sonde de débit', debit:'5 – 10 L/h'},
  {max:Infinity, nom:'Armoire de régulation pH collectivité (redondante)', debit:'sur mesure'},
];
const REGULATEURS_CL = [
  {max:50,  nom:'Régulateur Chlore compact — mono-voie', debit:'1 – 2 L/h'},
  {max:100, nom:'Régulateur Chlore/Redox — bi-voies', debit:'3 – 5 L/h'},
  {max:250, nom:'Régulateur Chlore professionnel + sonde de débit', debit:'5 – 10 L/h'},
  {max:Infinity, nom:'Armoire de régulation Chlore collectivité (redondante)', debit:'sur mesure'},
];
const REGULATEURS_PH_CL = [
  {max:50,  nom:'Régulateur pH/Chlore compact — station combinée', debit:'1 – 2 L/h par voie'},
  {max:100, nom:'Régulateur pH/Chlore — double pompe doseuse', debit:'3 – 5 L/h par voie'},
  {max:250, nom:'Régulateur pH/Chlore professionnel + sondes de débit', debit:'5 – 10 L/h par voie'},
  {max:Infinity, nom:'Armoire de régulation pH/Chlore collectivité (redondante)', debit:'sur mesure'},
];
const ELECTROLYSEURS = [
  {max:50,  nom:'Électrolyseur au sel — compact', capacite:'jusqu\'à 20 g/h'},
  {max:100, nom:'Électrolyseur au sel — standard', capacite:'jusqu\'à 40 g/h'},
  {max:200, nom:'Électrolyseur au sel — pro', capacite:'jusqu\'à 80 g/h'},
  {max:Infinity, nom:'Électrolyseur au sel — collectivité', capacite:'sur mesure'},
];

function pickTier(V, arr){ return arr.find(t=>V<=t.max) || arr[arr.length-1]; }
function chooseFilter(q){ return FILTERS.find(f=> f.surface*VITESSE_FILTRATION >= q) || FILTERS[FILTERS.length-1]; }
function choosePump(q){ return PUMPS.find(p=> p.q >= q) || PUMPS[PUMPS.length-1]; }

const NORMES_DISPONIBLES = [
  'NF P90-303 — Bassins de natation, éléments de structure',
  'NF/NM — Sécurité des piscines privées (barrières, alarmes, couvertures)',
  'NF C 15-100 — Installations électriques basse tension',
  'DTU 60.1 — Plomberie, canalisations',
  'NF EN 60335 — Sécurité des appareils électrodomestiques (pompes, PAC)',
  'Règlement sanitaire — Traitement et qualité de l\'eau',
];
const TYPE_PROJET_LABEL_KEY = {construction:'cps.type.construction', renovation:'cps.type.renovation', mise_aux_normes:'cps.type.misesauxnormes'};
function typeProjetLabel(k){ return t(TYPE_PROJET_LABEL_KEY[k]) || k; }
const COURANT_CONSEIL_KEY = {
  'Triphasé (choix confirmé)':'etude.courant.triconfirme',
  'Triphasé conseillé (charge totale élevée)':'etude.courant.triconseille',
  'Monophasé suffisant':'etude.courant.monosuffisant',
};

/* ---------------- Plans & usage quotas ---------------- */
// Four plans replace the old Starter/Pro/Enterprise grid. Two are for Particulier accounts
// (self-service CPS-only, or Owner tools), two are for Business accounts (same feature set,
// differing only by the size of the monthly quota — Business additionally gets a CPS
// allowance and write access to the shared product catalogue).
const PLAN_QUOTA_KEYS = ['cps','devis','entretien','chauffage','hydraulique','regulateur','electrolyseur'];
// PLAN_DEFAULTS is the seed/reset reference only — it is never read at runtime.
// The live, admin-editable plan data lives in STATE.plans (see loadState()),
// exactly like businesses/particuliers: the admin can control these 4 plans
// (price, quotas, catalogue-write permission) from Admin > Plans, the same way
// they already control individual business/particulier accounts.
// 'billing' is 'monthly' (default — a flat recurring subscription) for every plan except the
// standalone CPS plan, which is pay-per-use: 400 MAD is charged per CPS document generated,
// not a monthly fee. 'perUnitCategory' names which quota category that per-use price applies
// to; quotas.cps stays >0 on that plan only as an "is CPS offered" flag, never as a monthly cap.
// pricePeriod: 'unit' (pay-per-use), 'month', 'quarter' (3 mois), 'year'.
// priceAltMAD / priceAltPeriod: option de facturation secondaire (ex. Business
// mensuel OU trimestriel prépayé). Un quota à -1 = illimité (jamais bloquant).
const PLAN_DEFAULTS = {
  cps:          {id:'cps',          role:'particulier', priceMAD:400,  priceUSD:40, billing:'perUnit', perUnitCategory:'cps', pricePeriod:'unit',
    quotas:{cps:1,  devis:0,   entretien:0,   chauffage:0,   hydraulique:0,   regulateur:0,   electrolyseur:0},   catalogueWrite:false},
  proprietaire: {id:'proprietaire', role:'particulier', priceMAD:200,  priceUSD:20, pricePeriod:'month',
    quotas:{cps:0,  devis:5,   entretien:5,   chauffage:5,   hydraulique:5,   regulateur:5,   electrolyseur:5},   catalogueWrite:false},
  installateur: {id:'installateur', role:'business',    priceMAD:500,  priceUSD:50, pricePeriod:'month',
    quotas:{cps:0,  devis:50,  entretien:50,  chauffage:50,  hydraulique:50,  regulateur:50,  electrolyseur:50},  catalogueWrite:false, boutique:false},
  business:     {id:'business',     role:'business',    priceMAD:800,  priceUSD:80, pricePeriod:'month', priceAltMAD:2000, priceAltPeriod:'quarter',
    quotas:{cps:50, devis:500, entretien:500, chauffage:500, hydraulique:500, regulateur:500, electrolyseur:500}, catalogueWrite:true,  boutique:true},
  business_pro: {id:'business_pro', role:'business',    priceMAD:6000, priceUSD:600, pricePeriod:'year',
    quotas:{cps:-1, devis:-1,  entretien:-1,  chauffage:-1,  hydraulique:-1,  regulateur:-1,  electrolyseur:-1},  catalogueWrite:true,  boutique:true},
};
const PLAN_LABEL_KEY = {cps:'plan.cps.name', proprietaire:'plan.proprietaire.name', installateur:'plan.installateur.name', business:'plan.business.name', business_pro:'plan.businesspro.name'};
// Display order for the plans wherever they're listed together (the sidebar quick-switcher,
// Admin > Plans groups them by role instead but in this same particulier-then-business order).
const PLAN_ORDER = ['cps','proprietaire','installateur','business','business_pro'];
const PLAN_MIGRATE = {Starter:'installateur', Pro:'business', Enterprise:'business'}; // upgrade path for state saved before this feature existed
function planLabel(id){ const p = STATE.plans && STATE.plans[id]; return (p && p.customLabel) || t(PLAN_LABEL_KEY[id]) || id; }
function plansForRole(role){ return Object.values(STATE.plans).filter(p=>p.role===role); }
function isPerUnitCategory(plan, cat){ return !!(plan && plan.billing==='perUnit' && plan.perUnitCategory===cat); }
function quotaUnlimited(n){ return typeof n==='number' && n < 0; }   // -1 = illimité
function quotaIncluded(n){ return n !== 0; }                          // 0 = non inclus
// Suffixe de prix selon la période de facturation.
function periodSuffix(period){
  return period==='year' ? t('unit.per.year') : period==='quarter' ? t('unit.per.quarter') : t('unit.per.month');
}
// "800 MAD / mois" (+ "ou 2000 MAD / 3 mois" si option), "400 MAD / CPS" pour le pay-per-use.
function planUnitLabel(plan){
  if(plan.billing==='perUnit') return tf('unit.mad.per',{cat:t('plan.quota.'+plan.perUnitCategory)});
  let s = periodSuffix(plan.pricePeriod||'month');
  if(plan.priceAltMAD>0 && plan.priceAltPeriod) s += ' · ' + tf('plan.price.alt',{price:fmt(plan.priceAltMAD), per:periodSuffix(plan.priceAltPeriod)});
  return s;
}
// Libellé long, explicatif, utilisé UNIQUEMENT sur les cartes de tarifs / choix
// de formule. Retombe sur le libellé court `plan.quota.<cat>` s'il n'est pas
// défini. ⇒ pour reformuler les tarifs, éditer les clés `plan.feat.<cat>`.
function planFeatLabel(k){
  const lang = I18N[STATE.lang] || {};
  return lang['plan.feat.'+k] || I18N.fr['plan.feat.'+k] || t('plan.quota.'+k);
}
// One feature bullet for a plan's quota category.
function planFeatureLine(plan, k){
  if(isPerUnitCategory(plan, k)) return tf('plan.quota.perunit.line',{label:planFeatLabel(k)});
  if(quotaUnlimited(plan.quotas[k])) return tf('plan.quota.unlimited.line',{label:planFeatLabel(k)});
  return tf('plan.quota.line',{n:plan.quotas[k], label:planFeatLabel(k)});
}

function currentPeriod(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function getUsage(accId){
  if(!STATE.usage) STATE.usage = {};
  const period = currentPeriod();
  let u = STATE.usage[accId];
  if(!u || u.period!==period){ u = {period, cps:0, devis:0, entretien:0, chauffage:0, hydraulique:0, regulateur:0, electrolyseur:0}; STATE.usage[accId] = u; }
  if(u.hydraulique===undefined) u.hydraulique = 0;
  return u;
}
// Resolves to whichever business/particulier record the visitor is currently
// logged in as (STATE.auth.currentBusinessId/currentParticulierId, set at
// login/signup) — falls back to the original demo accounts (b1/p1) so the
// "MODE DÉMO" role switcher and existing saved sessions keep working.
function currentBusinessId(){ return STATE.auth.currentBusinessId || 'b1'; }
function currentParticulierId(){ return STATE.auth.currentParticulierId || 'p1'; }
function accountForRole(role){
  if(role==='business') return STATE.businesses.find(b=>b.id===currentBusinessId()) || STATE.businesses.find(b=>b.id==='b1');
  if(role==='particulier') return STATE.particuliers.find(p=>p.id===currentParticulierId()) || STATE.particuliers.find(p=>p.id==='p1');
  return null;
}
function planForRole(role){ const acc = accountForRole(role); return acc? STATE.plans[acc.plan] : null; }
// Abonnement Stripe terminé (résilié / impayé / expiré) : l'accès est coupé
// jusqu'à un nouveau paiement. `past_due` reste toléré (période de grâce Stripe).
var SUB_DEAD_STATUSES = ['canceled','unpaid','incomplete_expired'];
// Abonnement terminé (résilié / impayé / expiré).
function subInactive(acc){ return !!(acc && SUB_DEAD_STATUSES.indexOf(acc.stripeStatus) >= 0); }
// Compte sans abonnement Stripe vivant (jamais souscrit, ou résilié).
function subNever(acc){ return !!(acc && !acc.stripeStatus && (!BACKEND || !BACKEND.on || acc.stripeStatus === undefined)); }
// Essai gratuit d'inscription encore en cours (style Shopify, sans carte).
// Le plan CPS (paiement au document) n'a pas d'essai.
function trialActive(acc){ return !!(acc && acc.plan !== 'cps' && acc.trialEndsAt && new Date(acc.trialEndsAt) > new Date()); }
function trialDaysLeft(acc){ return acc && acc.trialEndsAt ? Math.max(0, Math.ceil((new Date(acc.trialEndsAt) - new Date())/86400000)) : 0; }
// Accès manuel accordé par l'admin (client qui paie en espèces / hors Stripe) :
// stripeStatus vaut 'manual' au lieu d'un statut Stripe réel. manualAccessUntil
// est optionnel — null/absent = accès manuel illimité jusqu'à révocation par l'admin.
function manualAccessExpired(acc){ return !!(acc && acc.stripeStatus==='manual' && acc.manualAccessUntil && new Date(acc.manualAccessUntil) <= new Date()); }
// Check and auto-revoke expired manual access on client side
function checkAndRevokeExpiredAccess(){
  let needsRevoke = false;
  STATE.businesses.forEach(b => {
    if(manualAccessExpired(b)){
      b.stripeStatus = null;
      b.manualAccessUntil = null;
      needsRevoke = true;
    }
  });
  STATE.particuliers.forEach(p => {
    if(manualAccessExpired(p)){
      p.stripeStatus = null;
      p.manualAccessUntil = null;
      needsRevoke = true;
    }
  });
  if(needsRevoke){
    saveState();
    showNotification('Accès manuel expiré - compte désactivé', 'warning');
  }
}
// Accès aux outils fermé : essai terminé ET pas d'abonnement vivant.
// Le plan CPS est exempté : il se paie au document (crédit CPS), pas d'abonnement.
function subBlocked(acc){
  if(acc && acc.plan === 'cps') return false;
  if(acc && acc.stripeStatus==='manual') return manualAccessExpired(acc);
  return !trialActive(acc) && (subInactive(acc) || subNever(acc));
}
function accountLocked(role){
  if(role !== 'business' && role !== 'particulier') return false;
  if(STATE.auth.adminTestActive) return false;
  return subBlocked(accountForRole(role));
}
function lockAllowedView(role){ return role + '.abonnement'; }
// Sidebar/topbar identity: shows the actual logged-in account's name (so an admin
// previewing a plan via "Tester l'accès" sees the test account's own name, e.g.
// "Compte test — Business", instead of the original demo business's name).
function displayName(role){
  if(role==='admin') return 'Omar (super-admin)';
  const acc = accountForRole(role);
  return (acc && acc.nom) || (role==='business'?'AquaTech Piscines':'Karim El Amrani');
}
function displayShortName(role){
  if(role==='admin') return 'Omar';
  const acc = accountForRole(role);
  if(!acc || !acc.nom) return role==='business'?'AquaTech':'Karim';
  return acc.nom.split(' ')[0];
}
function displayInitials(role){
  if(role==='admin') return 'AD';
  const acc = accountForRole(role);
  if(!acc || !acc.nom) return role==='business'?'AT':'KA';
  const parts = acc.nom.trim().split(/\s+/).filter(Boolean);
  return ((parts[0]||'')[0]||'') .concat((parts[1]||'')[0]||'').toUpperCase() || (role==='business'?'AT':'KA');
}
function quotaOf(role, cat){ const plan = planForRole(role); if(!plan) return 0; const q = plan.quotas[cat]; return q==null? 0 : q; }
function usageOf(role, cat){ const acc = accountForRole(role); return acc? (getUsage(acc.id)[cat]||0) : 0; }
function quotaRemaining(role, cat){
  const plan = planForRole(role);
  if(isPerUnitCategory(plan, cat)) return Infinity; // pay-per-use: no monthly cap, every use is just billed
  if(quotaUnlimited(quotaOf(role,cat))) return Infinity; // plan illimité
  return Math.max(0, quotaOf(role,cat) - usageOf(role,cat));
}
function tryConsume(role, cat){
  const acc = accountForRole(role); if(!acc) return false;
  if(accountLocked(role)) return false;
  if(quotaRemaining(role, cat) <= 0) return false;
  const u = getUsage(acc.id);
  // Production mode: wait for server confirmation before incrementing (prevents race conditions)
  // Local mode: optimistic increment with rollback if rejected
  if(BACKEND.on){
    // Server must confirm before we increment to prevent race conditions
    BACKEND.consumeQuota(role, acc.id, cat, u);
    return true;
  }
  // Local mode: optimistic increment (safe because single-user)
  u[cat] = (u[cat]||0) + 1; saveState();
  return true;
}
function canCatalogueWrite(role){ if(role==='admin') return true; const plan = planForRole(role); return plan? !!plan.catalogueWrite : false; }
// Boutique en ligne — a perk of the top Business plan: a shareable public product store.
function canBoutique(role){ const plan = planForRole(role); return plan? !!plan.boutique : false; }
// Ensures a business record carries a well-formed boutique config.
function normBoutique(b){
  if(!b.boutique || typeof b.boutique!=='object') b.boutique = {};
  const s = b.boutique;
  if(typeof s.active!=='boolean') s.active = false;
  if(typeof s.titre!=='string') s.titre = '';
  if(typeof s.intro!=='string') s.intro = '';
  if(typeof s.whatsapp!=='string') s.whatsapp = '';
  if(typeof s.telephone!=='string') s.telephone = '';
  if(typeof s.email!=='string') s.email = '';
  if(!s.produits || typeof s.produits!=='object') s.produits = {}; // { [catalogueId]: {prix:number|null} }
  return b;
}
// The products a business has switched on for its store, with the effective (store or catalogue) price.
function boutiqueProduits(b){
  const sel = (b.boutique && b.boutique.produits) || {};
  return STATE.catalogue.filter(c=> sel[c.id]).map(c=>{
    const override = sel[c.id] && sel[c.id].prix;
    const prix = (override==null || override==='' || isNaN(parseFloat(override))) ? c.prix : parseFloat(override);
    return {id:c.id, nom:c.nom, cat:c.cat, unite:c.unite, description:c.description||'', prix, fiche: c.fiche || null};
  });
}
// Total base64 budget for datasheets carried inside the share link.
const STORE_FICHE_BUDGET = 200000;
// How many selected products have a datasheet, and how many fit in the link budget.
function boutiqueFicheStats(b){
  const withFiche = boutiqueProduits(b).filter(p=>p.fiche && p.fiche.dataUrl).length;
  const dec = decodeStorePayload(encodeStorePayload(b));
  const included = dec ? dec.items.filter(i=>i.f).length : 0;
  return {withFiche, included, dropped: Math.max(0, withFiche-included)};
}
// Digits only, for building a wa.me link.
// International digits for a wa.me link. A local Moroccan mobile (0XXXXXXXXX) becomes 212XXXXXXXXX;
// a number already in international form (212…, 33…, +…) is kept as-is.
function waNumber(s){
  let n = String(s||'').replace(/[^\d+]/g,'').replace(/^\+/,'');
  if(/^0\d{9}$/.test(n)) n = '212' + n.slice(1);
  return n.replace(/\D/g,'');
}
function waLink(phone, text){ const n = waNumber(phone); return n? `https://wa.me/${n}${text?`?text=${encodeURIComponent(text)}`:''}` : ''; }
// Encode / decode a self-contained store snapshot carried in the URL hash (#store=...),
// so a business can share a working link before the real backend (Phase 4) exists.
function encodeStorePayload(b){
  const s = b.boutique || {};
  let budget = STORE_FICHE_BUDGET;
  const payload = {
    v:1,
    t: (s.titre || b.nom || '').slice(0,80),
    i: (s.intro || '').slice(0,400),
    w: waNumber(s.whatsapp),
    p: (s.telephone || '').slice(0,40),
    e: (s.email || '').slice(0,120),
    items: boutiqueProduits(b).map(p=>{
      const it = {n:p.nom.slice(0,90), c:p.cat.slice(0,40), d:(p.description||'').slice(0,400), u:p.unite, x:Math.round(p.prix||0)};
      // Carry the catalogue datasheet inside the link, greedily, until the budget is spent.
      if(p.fiche && p.fiche.dataUrl && p.fiche.dataUrl.length <= budget){
        it.f = {n:(p.fiche.name||'fiche.pdf').slice(0,80), u:p.fiche.dataUrl};
        budget -= p.fiche.dataUrl.length;
      }
      return it;
    }),
  };
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))); }catch(e){ return ''; }
}
function decodeStorePayload(str){
  try{ const o = JSON.parse(decodeURIComponent(escape(atob(str)))); return (o && Array.isArray(o.items)) ? o : null; }catch(e){ return null; }
}
function getStoreParam(){
  const h = String(location.hash||'');
  const m = h.match(/[#&]store=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function storeShareUrl(b){
  let base = (location.origin && location.origin!=='null') ? location.origin + location.pathname : (location.href.split('#')[0] || '');
  // Aperçu / data-URI : pas d'origine réelle -> on prend l'adresse publique
  // configurée (config.js), sinon l'hébergement GitHub Pages par défaut.
  if(/^data:/i.test(base) || base.length > 2000){
    base = ((window.AQUA_SUPABASE||{}).appOrigin || 'https://aqualc.com');
    if(!base.endsWith('/')) base += '/';
  }
  return base + '#store=' + encodeURIComponent(encodeStorePayload(b));
}
function hasDevisQuota(role){ const plan = planForRole(role); return plan? quotaIncluded(plan.quotas.devis) : false; }
function hasCpsQuota(role){ const plan = planForRole(role); return plan? quotaIncluded(plan.quotas.cps) : false; }
function hasSterilQuota(role){ const plan = planForRole(role); return plan? (quotaIncluded(plan.quotas.regulateur) || quotaIncluded(plan.quotas.electrolyseur)) : false; }
// Bouton de génération du CPS. En mode compte réel + plan CPS particulier :
// paiement à l'usage (Stripe Checkout mode payment) — 1 paiement = 1 crédit CPS,
// consommé à la génération. Sinon (démo, business, aperçu admin) : quota classique.
function cpsGenerateControls(role){
  if(role !== 'particulier' || !BACKEND.on || STATE.auth.adminTestActive)
    return quotaGatedButton(role, ['cps'], 'print-doc', 'i-print', 'devis.printbtn');
  const acc = accountForRole('particulier') || {};
  const credits = acc.cpsCredits || 0;
  const flash = checkoutFlash==='cps'
    ? `<div class="callout ok" style="margin-top:12px;">${ic('i-check')}<div>${t('cps.pay.received')}</div></div>` : '';
  const bal = `<div class="card-sub" style="margin:12px 0 6px;font-size:12.5px;">${tf('cps.credits.balance',{n:credits})}</div>`;
  const btn = credits > 0
    ? `<button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="cps-generate">${ic('i-print')} ${t('cps.generate.btn')}</button>`
    : `<button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="cps-pay">${ic('i-card')} ${t('cps.pay.btn')}</button>`;
  return flash + bal + btn;
}
// Renders either a quota-gated action button (data-action=<action>) with a remaining-count hint,
// or a blocking callout when the plan doesn't include this feature at all / the monthly quota is spent.
function quotaGatedButton(role, cats, action, iconName, labelKey){
  const plan = planForRole(role);
  const rows = cats.map(c=>({c, q:quotaOf(role,c), r:quotaRemaining(role,c)}));
  if(rows.some(x=>x.q===0)) return `<div class="callout warn" style="margin-top:12px;">${ic('i-info')}<div>${t('quota.notincluded')}</div></div>`;
  if(rows.some(x=>x.r<=0)) return `<div class="callout danger" style="margin-top:12px;">${ic('i-info')}<div>${t('quota.exhausted')}</div></div>`;
  const btn = `<button class="btn btn-primary" style="margin-top:12px;width:100%;justify-content:center;" data-action="${action}">${ic(iconName)} ${t(labelKey)}</button>`;
  // Pay-per-use category (e.g. the CPS plan): no "remaining/quota" — show what's been generated
  // this month and what it comes to at the plan's per-unit price instead.
  if(cats.length===1 && isPerUnitCategory(plan, cats[0])){
    const acc = accountForRole(role);
    const used = acc? (getUsage(acc.id)[cats[0]]||0) : 0;
    const total = used * (plan.priceMAD||0);
    return btn + `<div class="hint" style="display:block;margin-top:6px;text-align:center;">${tf('quota.perunit.hint',{price:fmt(plan.priceMAD), label:t('plan.quota.'+cats[0]), n:used, total:fmt(total)})}</div>`;
  }
  if(rows.every(x=>quotaUnlimited(x.q))) return btn + `<div class="hint" style="display:block;margin-top:6px;text-align:center;">${t('quota.unlimited')}</div>`;
  const minRemaining = Math.min(...rows.map(x=>x.r)), minQuota = Math.min(...rows.map(x=>x.q));
  return btn + `<div class="hint" style="display:block;margin-top:6px;text-align:center;">${tf('quota.remaining',{n:minRemaining, quota:minQuota})}</div>`;
}

/* ---------------- State (persisted) ---------------- */
let STATE = null;
function loadState(){
  try{
    const raw = localStorage.getItem('aqualc_v1');
    if(raw){ const parsed = JSON.parse(raw); STATE = Object.assign({}, JSON.parse(JSON.stringify(SEED)), parsed); }
    else STATE = JSON.parse(JSON.stringify(SEED));
  }catch(e){ STATE = JSON.parse(JSON.stringify(SEED)); }
  normalizeState();
}
// Migrations / valeurs par défaut appliquées à STATE, quelle que soit la clé localStorage
// d'où il vient : la clé générique 'aqualc_v1' (loadState, au tout premier chargement,
// avant de savoir qui est connecté) ou la clé propre au compte 'aqualc_<uid>' (rechargée
// dans BACKEND.hydrate() une fois la session Supabase connue — voir le commentaire là-bas).
function normalizeState(){
  if(!STATE.role) STATE.role='business';
  if(!STATE.view) STATE.view='business.overview';
  // Backfill catalogue products introduced by a later app update (matched by stable key), so
  // calculator-generated lines keep a real price on an older save without disturbing admin edits.
  if(Array.isArray(STATE.catalogue)){
    SEED.catalogue.forEach(seed=>{ if(seed.key && !STATE.catalogue.some(c=>c.key===seed.key)) STATE.catalogue.push(JSON.parse(JSON.stringify(seed))); });
    // The single "Sable filtrant" line was split into gravel + silica sand; rename the
    // old default so an existing save reads consistently (skips it if the admin edited it).
    const oldSable = STATE.catalogue.find(c=>c.key==='sable-filtrant' && c.nom==='Sable filtrant (sac 25kg)');
    if(oldSable) oldSable.nom = 'Sable de silice 0,4–0,8 mm (sac 25kg)';
  }
  if(!STATE.categories || !STATE.categories.length) STATE.categories = [...new Set((STATE.catalogue||[]).map(c=>c.cat))];
  if(!STATE.devisTemplate.validiteJours) STATE.devisTemplate.validiteJours = 30;
  if(!STATE.devisTemplate.conditionsPaiement) STATE.devisTemplate.conditionsPaiement = SEED.devisTemplate.conditionsPaiement;
  if(STATE.devisCourant.remisePct===undefined) STATE.devisCourant.remisePct = 0;
  if(!STATE.particulierDevisCourant) STATE.particulierDevisCourant = JSON.parse(JSON.stringify(SEED.particulierDevisCourant));
  if(STATE.particulierDevisCourant.remisePct===undefined) STATE.particulierDevisCourant.remisePct = 0;
  if(!STATE.cpsForm) STATE.cpsForm = JSON.parse(JSON.stringify(SEED.cpsForm));
  // CPS: phasing as an editable list, plus editable "objet" text and custom articles (added post-launch).
  if(!Array.isArray(STATE.cpsForm.phasageSteps)) STATE.cpsForm.phasageSteps = String(STATE.cpsForm.phasage||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(typeof STATE.cpsForm.objet!=='string') STATE.cpsForm.objet = '';
  if(!Array.isArray(STATE.cpsForm.articles)) STATE.cpsForm.articles = [];
  if(!Array.isArray(STATE.cpsForm.receptionList)) STATE.cpsForm.receptionList = STATE.cpsForm.reception ? [String(STATE.cpsForm.reception)] : JSON.parse(JSON.stringify(SEED.cpsForm.receptionList));
  if(!Array.isArray(STATE.cpsForm.exclusionsList)) STATE.cpsForm.exclusionsList = STATE.cpsForm.exclusions ? [String(STATE.cpsForm.exclusions)] : JSON.parse(JSON.stringify(SEED.cpsForm.exclusionsList));
  if(!STATE.devisTab) STATE.devisTab = 'devis';
  if(!Array.isArray(STATE.devisHistory)) STATE.devisHistory = [];
  if(!Array.isArray(STATE.calcHistory)) STATE.calcHistory = [];
  if(!STATE.calcResult || typeof STATE.calcResult!=='object') STATE.calcResult = {etude:null, entretien:null, hydraulique:null, sterilisation:null};
  ['etude','entretien','hydraulique','sterilisation'].forEach(k=>{ if(!(k in STATE.calcResult)) STATE.calcResult[k]=null; });
  if(!STATE.demandesDevis) STATE.demandesDevis = [];
  STATE.lang = 'fr'; // French-only: language switcher removed at the user's request
  if(!STATE.exchangeRates) STATE.exchangeRates = JSON.parse(JSON.stringify(SEED.exchangeRates));
  if(!STATE.devisTemplate.devise) STATE.devisTemplate.devise = 'MAD';
  if(!STATE.usage) STATE.usage = {};
  if(!STATE.auth) STATE.auth = JSON.parse(JSON.stringify(SEED.auth));
  if(!STATE.auth.accounts) STATE.auth.accounts = JSON.parse(JSON.stringify(SEED.auth.accounts));
  if(!STATE.auth.accounts.admin) STATE.auth.accounts.admin = JSON.parse(JSON.stringify(SEED.auth.accounts.admin));
  // Migrate from the old single-demo-account shape (accounts.business / accounts.particulier
  // as one object each) to lists of credentials, so multiple people can sign up and log in
  // with their own account instead of everyone sharing one hardcoded business/particulier.
  if(!Array.isArray(STATE.auth.accounts.businesses)){
    const old = STATE.auth.accounts.business;
    STATE.auth.accounts.businesses = old ? [{id:uid(), businessId:'b1', email:old.email, password:old.password}] : JSON.parse(JSON.stringify(SEED.auth.accounts.businesses));
    delete STATE.auth.accounts.business;
  }
  if(!Array.isArray(STATE.auth.accounts.particuliers)){
    const old = STATE.auth.accounts.particulier;
    STATE.auth.accounts.particuliers = old ? [{id:uid(), particulierId:'p1', email:old.email, password:old.password}] : JSON.parse(JSON.stringify(SEED.auth.accounts.particuliers));
    delete STATE.auth.accounts.particulier;
  }
  if(!STATE.auth.currentBusinessId) STATE.auth.currentBusinessId = 'b1';
  if(!STATE.auth.currentParticulierId) STATE.auth.currentParticulierId = 'p1';
  if(STATE.auth.adminTestActive===undefined) STATE.auth.adminTestActive = false;
  if(STATE.auth.adminTestPrevBusinessId===undefined) STATE.auth.adminTestPrevBusinessId = null;
  if(STATE.auth.adminTestPrevParticulierId===undefined) STATE.auth.adminTestPrevParticulierId = null;
  if(!STATE.publicView || !['landing','pricing','login','signup'].includes(STATE.publicView)) STATE.publicView = 'landing';
  if(!STATE.signupPlan) STATE.signupPlan = 'proprietaire';
  // STATE.plans holds the live, admin-editable plan data (price, quotas, catalogue-write).
  // Seeded from PLAN_DEFAULTS on first load; any plan added later by an app update is
  // merged in without touching plans the admin has already customized.
  if(!STATE.plans) STATE.plans = JSON.parse(JSON.stringify(PLAN_DEFAULTS));
  else Object.keys(PLAN_DEFAULTS).forEach(id=>{
    if(!STATE.plans[id]) STATE.plans[id] = JSON.parse(JSON.stringify(PLAN_DEFAULTS[id]));
    // Backfill any field introduced by a later app update (e.g. billing/perUnitCategory) onto
    // a plan already persisted from an older save, without touching admin-edited values.
    else Object.keys(PLAN_DEFAULTS[id]).forEach(k=>{ if(STATE.plans[id][k]===undefined) STATE.plans[id][k] = PLAN_DEFAULTS[id][k]; });
  });
  // Backfill des clés de quota ajoutées après coup (ex. 'hydraulique') sur les plans déjà persistés.
  Object.keys(STATE.plans).forEach(id=>{
    const q = STATE.plans[id].quotas; if(!q) return;
    PLAN_QUOTA_KEYS.forEach(k=>{ if(q[k]===undefined) q[k] = (PLAN_DEFAULTS[id] && PLAN_DEFAULTS[id].quotas[k]) || 0; });
    if(STATE.plans[id].pricePeriod===undefined) STATE.plans[id].pricePeriod = (PLAN_DEFAULTS[id] && PLAN_DEFAULTS[id].pricePeriod) || 'month';
  });
  // Refonte des formules (Sept. 2026) — n'écrase que les plans encore aux anciennes valeurs par défaut.
  if(STATE.planRev !== 2){
    const pp = STATE.plans.proprietaire;
    if(pp && pp.quotas && pp.quotas.devis === 1)
      ['devis','entretien','chauffage','hydraulique','regulateur','electrolyseur'].forEach(k=> pp.quotas[k] = 5);
    const bz = STATE.plans.business;
    if(bz && bz.priceMAD === 2500){ bz.priceMAD = 800; bz.priceAltMAD = 2000; bz.priceAltPeriod = 'quarter'; }
    STATE.planRev = 2;
  }
  // Migrate accounts from the old Starter/Pro/Enterprise grid (or fill in a default) to the new plan ids.
  STATE.businesses.forEach(b=>{ if(PLAN_MIGRATE[b.plan]) b.plan = PLAN_MIGRATE[b.plan]; if(!STATE.plans[b.plan] || STATE.plans[b.plan].role!=='business') b.plan = 'installateur'; });
  STATE.businesses.forEach(normBoutique); // online-store config, added after launch
  // Initialize trial fields for accounts created before phase 4
  STATE.businesses.forEach(b=>{ if(b.trialEndsAt===undefined) b.trialEndsAt=null; });
  STATE.particuliers.forEach(p=>{ if(!STATE.plans[p.plan] || STATE.plans[p.plan].role!=='particulier') p.plan = 'proprietaire'; });
  // Client follow-up fields (phone, description, payment, step tasks, follow-up log) were
  // added after launch — backfill them on records saved before, so the detail panel is safe.
  STATE.particuliers.forEach(normClient);
  STATE.particuliers.forEach(p=>{ if(p.trialEndsAt===undefined) p.trialEndsAt=null; });
}
// Ensures every client record carries the follow-up fields the detail panel reads.
function normClient(p){
  if(p.telephone===undefined) p.telephone='';
  if(p.email===undefined) p.email='';
  if(p.adresse===undefined) p.adresse='';
  if(p.description===undefined) p.description='';
  // 'aucun' = no billing opened yet (the neutral default for a fresh client)
  if(!['aucun','non','partiel','paye'].includes(p.paiement)) p.paiement='aucun';
  if(typeof p.montantPaye!=='number') p.montantPaye = parseFloat(p.montantPaye)||0;
  if(typeof p.montantTotal!=='number') p.montantTotal = parseFloat(p.montantTotal)||0;
  if(!Array.isArray(p.taches)) p.taches=[];
  if(!Array.isArray(p.suivi)) p.suivi=[];
  return p;
}
// Moroccan mobile shown as "06 12 34 56 78"; anything else printed as-is.
function fmtPhone(s){
  const n = String(s||'').replace(/\s+/g,'');
  return /^0\d{9}$/.test(n) ? n.replace(/(\d{2})(?=\d)/g,'$1 ').trim() : String(s||'');
}
// Format numbers with thousand separators (1000 -> "1 000")
function fmtNumber(n, decimals=0){
  if(n===null || n===undefined) return '';
  const num = parseFloat(n);
  if(isNaN(num)) return String(n);
  return num.toLocaleString('fr-FR', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function saveState(){
  const be = (typeof BACKEND !== 'undefined' && BACKEND.on) ? BACKEND : null;
  try{ localStorage.setItem(be && be.uid ? 'aqualc_'+be.uid : 'aqualc_v1', JSON.stringify(STATE)); }
  catch(e){
    console.warn('localStorage error:', e.message);
    if(e.name === 'QuotaExceededError'){
      showNotification('Erreur de stockage: données trop volumineuses', 'error');
    }
  }
  // MODE COMPTE RÉEL : pousse l'identité du compte vers Supabase (débounce).
  // Phase 4 étendra cette synchro aux clients / devis / calculateurs.
  if(be) be.pushSoon();
  return true;
}

// Display user-friendly error/success messages
let notificationTimeout;
function showNotification(message, type='info'){
  clearTimeout(notificationTimeout);
  const box = document.createElement('div');
  box.className = `notification notification-${type}`;
  box.style.cssText = `position:fixed;top:20px;right:20px;max-width:320px;padding:12px 16px;border-radius:var(--radius);background:${type==='error'?'var(--danger-soft)':type==='success'?'var(--success-soft)':'var(--surface-2)'};color:${type==='error'?'var(--danger)':type==='success'?'var(--success)':'var(--text)'};font-size:13px;box-shadow:var(--shadow-md);z-index:100;animation:slideIn 0.3s ease;`;
  box.textContent = message;
  document.body.appendChild(box);
  notificationTimeout = setTimeout(()=>box.remove(), 3000);
}
