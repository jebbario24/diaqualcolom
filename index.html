function bindDevisTab(){
  $$('.dv-input').forEach(inp=> inp.addEventListener('input', ()=>{
    const target = inp.dataset.scope==='template'? STATE.devisTemplate : STATE.devisCourant;
    // Keep the raw string while typing (never coerce mid-keystroke — it eats decimal points);
    // every place that consumes these fields already runs it through parseFloat/Number.
    target[inp.dataset.k] = inp.value;
    saveState(); render();
  }));
  const logoInput = $('#dv-logo');
  if(logoInput) logoInput.addEventListener('change', ()=>{
    const file = logoInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ STATE.devisTemplate.logo = reader.result; saveState(); render(); };
    reader.readAsDataURL(file);
  });
  $$('.it-nom').forEach(inp=> inp.addEventListener('input', ()=>{ const it=STATE.devisCourant.items.find(x=>x.id===inp.dataset.id); if(it){ it.nom=inp.value; itemAutocompleteId = inp.value.trim()? inp.dataset.id : null; saveState(); render(); } }));
  $$('.it-qte').forEach(inp=> inp.addEventListener('input', ()=>{ const it=STATE.devisCourant.items.find(x=>x.id===inp.dataset.id); if(it){ it.qte=inp.value; saveState(); render(); } }));
  $$('.it-prix').forEach(inp=> inp.addEventListener('input', ()=>{ const it=STATE.devisCourant.items.find(x=>x.id===inp.dataset.id); if(it){ it.prix=inp.value; saveState(); render(); } }));
  $$('[data-action="rm-item"]').forEach(b=> b.addEventListener('click', ()=>{ STATE.devisCourant.items = STATE.devisCourant.items.filter(x=>x.id!==b.dataset.id); saveState(); render(); }));
  const clearBtn = $('[data-action="clear-devis"]'); if(clearBtn) clearBtn.addEventListener('click', ()=>{ if(confirm(t('confirm.cleardevis'))){ STATE.devisCourant.items=[]; saveState(); render(); } });
  bindItemAutocomplete(STATE.devisCourant.items);

  const toggleLineBtn = $('[data-action="toggle-add-line"]'); if(toggleLineBtn) toggleLineBtn.addEventListener('click', ()=> $('#add-line-form').classList.toggle('hidden'));
  const catalogueSelect = $('#al-catalogue');
  if(catalogueSelect) catalogueSelect.addEventListener('change', ()=>{
    const opt = catalogueSelect.selectedOptions[0];
    if(opt && opt.value){ $('#al-nom').value = opt.dataset.nom; $('#al-prix').value = opt.dataset.prix; }
  });
  const addLineBtn = $('[data-action="add-manual-line"]');
  if(addLineBtn) addLineBtn.addEventListener('click', ()=>{
    const nom = $('#al-nom').value.trim(); if(!nom) return;
    const qte = parseFloat($('#al-qte').value)||0;
    const prix = parseFloat($('#al-prix').value)||0;
    const opt = catalogueSelect.selectedOptions[0];
    const unite = (opt && opt.value) ? opt.dataset.unite : 'u';
    const key = (opt && opt.value) ? (opt.dataset.key||null) : null;
    const existing = STATE.devisCourant.items.find(x=> (key && x.key===key) || (!key && !x.key && x.nom===nom));
    if(existing){ existing.qte = round2((parseFloat(existing.qte)||0) + qte); existing.prix = prix; }
    else STATE.devisCourant.items.push({id:uid(), key, nom, qte:round2(qte), unite, prix});
    saveState(); render();
  });
}

function bindCps(role, standalone){
  role = role || 'business';
  $$('.cps-input').forEach(el=> el.addEventListener('input', ()=>{
    STATE.cpsForm[el.dataset.k] = el.value;
    saveState(); render();
  }));
  const cpsClientSel = $('.cps-client-select');
  if(cpsClientSel) cpsClientSel.addEventListener('change', ()=>{ STATE.devisCourant.client = cpsClientSel.value; saveState(); render(); });
  $$('.cps-norme').forEach(chk=> chk.addEventListener('change', ()=>{
    const val = chk.value;
    if(chk.checked){ if(!STATE.cpsForm.normes.includes(val)) STATE.cpsForm.normes.push(val); }
    else { STATE.cpsForm.normes = STATE.cpsForm.normes.filter(n=>n!==val); }
    saveState(); render();
  }));
  // Phasage — editable list of steps
  const cf = STATE.cpsForm;
  if(!Array.isArray(cf.phasageSteps)) cf.phasageSteps = [];
  const bindCpsList = (key, cls, addAction, delAction)=>{
    if(!Array.isArray(cf[key])) cf[key] = [];
    $$('.'+cls).forEach(inp=> inp.addEventListener('input', ()=>{ cf[key][+inp.dataset.i] = inp.value; saveState(); render(); }));
    $$('[data-action="'+delAction+'"]').forEach(b=> b.addEventListener('click', ()=>{ cf[key].splice(+b.dataset.i, 1); saveState(); render(); }));
    const addBtn = $('[data-action="'+addAction+'"]');
    if(addBtn) addBtn.addEventListener('click', ()=>{ cf[key].push(''); saveState(); render(); const els=$$('.'+cls); if(els.length) els[els.length-1].focus(); });
  };
  bindCpsList('phasageSteps', 'cps-phase', 'cps-phase-add', 'cps-phase-del');
  bindCpsList('receptionList', 'cps-recep', 'cps-recep-add', 'cps-recep-del');
  bindCpsList('exclusionsList', 'cps-excl', 'cps-excl-add', 'cps-excl-del');
  // Articles / clauses personnalisés
  if(!Array.isArray(cf.articles)) cf.articles = [];
  $$('.cps-art-titre').forEach(inp=> inp.addEventListener('input', ()=>{ const a=cf.articles.find(x=>x.id===inp.dataset.id); if(a){ a.titre=inp.value; saveState(); render(); } }));
  $$('.cps-art-texte').forEach(inp=> inp.addEventListener('input', ()=>{ const a=cf.articles.find(x=>x.id===inp.dataset.id); if(a){ a.texte=inp.value; saveState(); render(); } }));
  $$('[data-action="cps-art-del"]').forEach(b=> b.addEventListener('click', ()=>{ cf.articles = cf.articles.filter(x=>x.id!==b.dataset.id); saveState(); render(); }));
  const artAdd = $('[data-action="cps-art-add"]');
  if(artAdd) artAdd.addEventListener('click', ()=>{ cf.articles.push({id:uid(), titre:'', texte:''}); saveState(); render(); });
  if(standalone){
    const printBtn = $('[data-action="print-doc"]');
    if(printBtn) printBtn.addEventListener('click', ()=>{
      if(!tryConsume(role,'cps')) return render();
      render(); printNow();
    });
    // Plan CPS (compte réel) : payer à l'usage
    const payBtn = $('[data-action="cps-pay"]');
    if(payBtn) payBtn.addEventListener('click', async ()=>{
      payBtn.disabled = true;
      const r = await BACKEND.startCheckout('cps');
      if(r && r.error){ payBtn.disabled = false; alert(t('abon.checkout.err')+'\n'+r.error); }
    });
    const genBtn = $('[data-action="cps-generate"]');
    if(genBtn) genBtn.addEventListener('click', async ()=>{
      genBtn.disabled = true;
      const acc = accountForRole('particulier');
      const ok = await BACKEND.consumeCpsCredit('particulier', acc.id);
      if(!ok){
        genBtn.disabled = false;
        try{ const s=(await BACKEND.sb.auth.getSession()).data.session; if(s) await BACKEND.hydrate(s); }catch(e){}
        alert(t('cps.credits.none')); render(); return;
      }
      if(acc.cpsCredits > 0) acc.cpsCredits -= 1;
      checkoutFlash = null;
      saveState(); render(); printNow();
    });
  }
}

// Badge d'état d'abonnement Stripe.
function stripeStatusBadge(s){
  if(!s) return '';
  const map = { active:'ok', trialing:'ok', past_due:'warn', unpaid:'bad', canceled:'neutral', incomplete:'warn', incomplete_expired:'bad', manual:'ok' };
  return `<span class="badge ${map[s]||'neutral'}"><span class="badge-dot"></span>${t('abon.status.'+s)||esc(s)}</span>`;
}

let acctEmailMsg = null, acctPwdMsg = null, acctIdentityMsg = null; // transient feedback, cleared on each render
// Resolves to the login credential record for the currently logged-in account —
// the admin's single credentials, or whichever business/particulier entry points
// at the account they're logged in as (currentBusinessId/currentParticulierId).
function authAccountForRole(role){
  if(role==='admin') return STATE.auth.accounts.admin;
  if(role==='business'){
    const bizId = currentBusinessId();
    let auth = STATE.auth.accounts.businesses.find(a=>a.businessId===bizId);
    if(!auth) auth = healAuthAccount('businesses', 'businessId', bizId, STATE.businesses.find(b=>b.id===bizId));
    return auth;
  }
  if(role==='particulier'){
    const partId = currentParticulierId();
    let auth = STATE.auth.accounts.particuliers.find(a=>a.particulierId===partId);
    if(!auth) auth = healAuthAccount('particuliers', 'particulierId', partId, STATE.particuliers.find(p=>p.id===partId));
    return auth;
  }
  return null;
}
// A business/particulier record can exist without a matching login credential — notably an
// admin "test access" preview account (Admin > Plans / the sidebar plan switcher), which is
// created on the fly and never goes through signup. Synthesize one here (same lazy pattern as
// getUsage()) so Account Settings never crashes on a missing credential record.
function healAuthAccount(listKey, idKey, id, acc){
  const auth = {id:uid(), [idKey]:id, email: acc && acc.isTestAccount ? `test-${acc.plan}@aqualc.local` : `compte-${id}@aqualc.local`, password:'test1234'};
  STATE.auth.accounts[listKey].push(auth);
  return auth;
}

}

function bindAccountSettings(role){
  const acc = authAccountForRole(role);
  const saveEmailBtn = $('[data-action="save-email"]');
  if(saveEmailBtn) saveEmailBtn.addEventListener('click', async ()=>{
    const val = ($('#acct-email').value||'').trim();
    if(!val || !val.includes('@')) return;
    if(BACKEND.on){
      saveEmailBtn.disabled = true;
      const { error } = await BACKEND.sb.auth.updateUser({ email: val });
      saveEmailBtn.disabled = false;
      acctEmailMsg = error ? 'account.email.err' : 'ok';
      if(!error && acc) acc.email = val;
      return render();
    }
    acc.email = val; acctEmailMsg = 'ok'; saveState(); render();
  });
  const savePwdBtn = $('[data-action="save-password"]');
  if(savePwdBtn) savePwdBtn.addEventListener('click', async ()=>{
    const current = ($('#acct-pwd-current')||{}).value||'';
    const next = ($('#acct-pwd-new')||{}).value||'';
    const confirm = ($('#acct-pwd-confirm')||{}).value||'';
    if(!next || next.length<6){ acctPwdMsg='account.password.err.short'; return render(); }
    if(next!==confirm){ acctPwdMsg='account.password.err.mismatch'; return render(); }
    if(BACKEND.on){
      // La session prouve déjà l'identité — Supabase ne revérifie pas le mot de passe actuel.
      savePwdBtn.disabled = true;
      const { error } = await BACKEND.sb.auth.updateUser({ password: next });
      savePwdBtn.disabled = false;
      acctPwdMsg = error ? 'account.password.err.generic' : 'ok';
      return render();
    }
    if(current!==acc.password){ acctPwdMsg='account.password.err.current'; return render(); }
    acc.password = next; acctPwdMsg='ok'; saveState(); render();
  });
  const saveIdBtn = $('[data-action="save-identity"]');
  if(saveIdBtn) saveIdBtn.addEventListener('click', ()=>{
    const b = accountForRole('business'); if(!b) return;
    const nom = ($('#acct-biz-nom').value||'').trim();
    if(!nom){ $('#acct-biz-nom').focus(); return; }
    b.nom = nom;
    b.telephone = ($('#acct-biz-tel').value||'').trim();
    b.ice = ($('#acct-biz-ice').value||'').trim();
    b.adresse = ($('#acct-biz-adr').value||'').trim();
    b.email = acc.email;
    // Documents follow the company identity — keep the devis template in sync.
    STATE.devisTemplate.societe = nom;
    STATE.devisTemplate.piedDePage = composeFooter(b);
    acctIdentityMsg = 'ok'; saveState(); render();
  });
  const logoutBtn = $('[data-action="logout-account"]');
  if(logoutBtn) logoutBtn.addEventListener('click', doLogout);
}
async function doLogout(){
  if(BACKEND.on) await BACKEND.signOut();
  // Clear all localStorage keys used by this app
  const keys = Object.keys(localStorage).filter(k => k.startsWith('aqualc'));
  keys.forEach(k => localStorage.removeItem(k));
  localStorage.removeItem('signup-plan-selection');
  localStorage.removeItem('signup-draft');

  // Reset all state variables
  STATE = initState();
  signupDraft = {plan:'', nom:'', ville:'', email:'', password:'', passwordConfirm:''};
  acctEmailMsg = null; acctPwdMsg = null; acctIdentityMsg = null; loginError = null;

  render();
}

      <thead><tr><th>${t('th.date')}</th><th class="num">${t('entretien.ph.label')}</th><th class="num">${t('th.chlore')}</th><th>${t('th.note')}</th></tr></thead>

    </table></div>
  `;
}
function viewDemandeDevis(){
  const p = STATE.particuliers.find(p=>p.id===currentParticulierId());
  const biz = p && STATE.businesses.find(b=>b.id===p.businessId);
  const mesDemandes = (STATE.demandesDevis||[]).filter(d=>d.particulierId===currentParticulierId());
  return `
    <div class="card" style="max-width:520px;">
      <div class="card-title">${t('part.demande.title')}</div>
      ${biz? `
        <p class="card-sub" style="margin:10px 0 16px;">${tf('part.demande.attached',{biz:'<b style=\'color:var(--text)\'>'+esc(biz.nom)+'</b>'})}</p>
        <div class="form-grid">
          <div class="field"><label>${t('part.demande.message')}</label><textarea class="input" id="dd-message" placeholder="${t('ph.demande.message')}"></textarea></div>
          <button class="btn btn-primary" data-action="send-request">${ic('i-file')} ${t('part.demande.send')}</button>
        </div>
      ` : `<p class="card-sub" style="margin:10px 0 0;">${t('part.demande.noattach')}</p>`}
    </div>
    ${mesDemandes.length? `
    <div class="section-head"><h2>${t('part.demande.sent.title')}</h2></div>
    <div class="table-wrap" style="max-width:520px;"><table>
      <thead><tr><th>${t('th.date')}</th><th>${t('th.message')}</th><th>${t('th.statut')}</th></tr></thead>
      <tbody>${mesDemandes.map(d=>`<tr><td class="mono">${d.date}</td><td>${esc(d.message)||'—'}</td><td><span class="badge ok"><span class="badge-dot"></span>${t('part.demande.sentbadge')}</span></td></tr>`).join('')}</tbody>
    </table></div>` : ''}
  `;
}
function bindDemandeDevis(){
  const btn = $('[data-action="send-request"]');
  if(btn) btn.addEventListener('click', ()=>{
    const p = STATE.particuliers.find(p=>p.id===currentParticulierId());
    if(!p) return;
    const msgEl = $('#dd-message');
    const message = msgEl? msgEl.value.trim() : '';
    if(!STATE.demandesDevis) STATE.demandesDevis = [];
    STATE.demandesDevis.unshift({id:uid(), particulierId:p.id, businessId:p.businessId, message, date:new Date().toISOString().slice(0,10)});
    saveState(); render();
  });
}

/* ---------------- Init ---------------- */
if(window.matchMedia){ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(!STATE.theme) render(); }); }
window.addEventListener('hashchange', render); // opening / leaving a shared boutique link

(async function boot(){
  // Retour de Stripe Checkout / Customer Portal
  const qp = new URLSearchParams(location.search);
  const checkoutResult = qp.get('checkout');
  if(checkoutResult || qp.get('view')){
    const clean = location.pathname + location.hash;
    try{ history.replaceState(null, '', clean); }catch(e){}
  }
  if(BACKEND.on){
    try{
      const { data } = await BACKEND.sb.auth.getSession();
      if(data && data.session){ await BACKEND.hydrate(data.session); }
      else { STATE.auth.loggedIn = false; }
      BACKEND.sb.auth.onAuthStateChange((evt)=>{
        if(evt === 'SIGNED_OUT'){ STATE.auth.loggedIn = false; STATE.publicView = 'landing'; render(); }
      });
      if(checkoutResult === 'success' && STATE.auth.loggedIn){
        STATE.view = STATE.role==='business' ? 'business.abonnement' : 'particulier.abonnement';
        checkoutFlash = 'success';
        // Le webhook peut mettre 1-2 s : on recharge l'état une fois après un court délai.
        setTimeout(async ()=>{ try{ const s = (await BACKEND.sb.auth.getSession()).data.session; if(s){ await BACKEND.hydrate(s); render(); } }catch(e){} }, 3000);
      } else if(checkoutResult === 'cps' && STATE.auth.loggedIn){
        // Paiement CPS à l'usage : on revient sur l'écran CPS et on recharge le solde de crédits.
        if(STATE.role === 'particulier') STATE.view = 'particulier.cps';
        checkoutFlash = 'cps';
        setTimeout(async ()=>{ try{ const s = (await BACKEND.sb.auth.getSession()).data.session; if(s){ await BACKEND.hydrate(s); render(); } }catch(e){} }, 3000);
      } else if(checkoutResult === 'cancel'){
        checkoutFlash = 'cancel';
      }
      // Retour du portail client Stripe (?view=abonnement) : on rouvre la page abonnement.
      if(qp.get('view') === 'abonnement' && STATE.auth.loggedIn){
        STATE.view = STATE.role==='business' ? 'business.abonnement' : 'particulier.abonnement';
      }
    }catch(e){ console.error('backend boot failed', e); }
  }

  // Offline mode detection
  let isOffline = !navigator.onLine;
  const handleOnline = ()=>{ isOffline = false; if(STATE.auth.loggedIn) render(); };
  const handleOffline = ()=>{ isOffline = true; if(STATE.auth.loggedIn) render(); };
  window.addEventListener('online', handleOnline);
  window.addEventListener('offline', handleOffline);

  // Check for expired manual access
  checkAndRevokeExpiredAccess();

  render();
})();
</script>
