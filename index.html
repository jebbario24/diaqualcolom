/* ======================================================================
   BACKEND (Supabase) — Phase 3 : authentification réelle
   ----------------------------------------------------------------------
   Actif uniquement si window.AQUA_SUPABASE.{url,anonKey} sont renseignés
   ET que la librairie supabase-js a pu être chargée. Sinon `BACKEND.on`
   reste false et toute l'app fonctionne comme le prototype d'origine.
   ====================================================================== */
const BACKEND = (function(){
  const cfg = window.AQUA_SUPABASE || {};
  const ready = !!(cfg.url && cfg.anonKey && window.supabase && window.supabase.createClient);
  const api = {
    on: ready,
    uid: null,
    sb: ready ? window.supabase.createClient(cfg.url, cfg.anonKey) : null,
    _timer: null,
    // Recharge STATE.auth + l'identité du compte depuis une session Supabase.
    async hydrate(session){
      const u = session && session.user; if(!u) return false;
      api.uid = u.id;
      // Recharge le cache local propre à ce compte (page en cours, brouillons de devis/CPS,
      // profil du bassin saisi, résultats de calculateurs...). loadState() a tourné avant que
      // la session Supabase soit connue et n'a donc pu lire que la clé générique 'aqualc_v1'
      // (vide pour un vrai compte, puisque saveState() écrit sous 'aqualc_<uid>' dès qu'un
      // utilisateur est connecté) — sans ce rattrapage, tout F5 repartait de la formule par
      // défaut (business.overview) et perdait toute saisie pas encore poussée vers Supabase.
      try{
        const raw = localStorage.getItem('aqualc_'+u.id);
        if(raw){ STATE = Object.assign({}, JSON.parse(JSON.stringify(SEED)), JSON.parse(raw)); normalizeState(); }
      }catch(e){ console.warn('local cache restore failed', e); }
      api.myBiz = null;
      const { data: profile } = await api.sb.from('profiles').select('role').eq('id', u.id).single();
      const role = (profile && profile.role) || 'business';
      STATE.role = role;
      STATE.auth.loggedIn = true;
      STATE.auth.email = u.email || '';
      if(role === 'business'){
        const { data: b } = await api.sb.from('businesses').select('*').eq('profile_id', u.id).single();
        if(b){
          const rec = STATE.businesses.find(x=>x.id===b.id) || {};
          Object.assign(rec, { id:b.id, nom:b.nom, ville:b.ville||'—', plan:b.plan, statut:b.statut,
            inscription:b.inscription, email:b.email||u.email||'', telephone:b.telephone||'', adresse:b.adresse||'',
            ice:b.ice||'', stripeStatus:b.stripe_subscription_status||null, stripeCancelAtEnd:!!b.stripe_cancel_at_period_end,
            trialEndsAt:b.trial_ends_at||null, cpsCredits:b.cps_credits||0, manualAccessUntil:b.manual_access_until||null });
          if(!STATE.businesses.some(x=>x.id===b.id)) STATE.businesses.unshift(rec);
          STATE.auth.currentBusinessId = b.id;
          api.myBiz = b.id;
          // --- Phase 4 · morceau 2 : fiches clients de ce Business ---
          try{
            // Load clients with pagination (max 1000) to avoid performance issues with large customer bases
            const { data: clients } = await api.sb.from('particuliers').select('*').eq('business_id', b.id).range(0, 999);
            STATE.particuliers = (clients||[]).map(api._clientFromDb);
            api._clientSnap = new Set(STATE.particuliers.map(c=>c.id));
            // TODO: Implement lazy loading UI for businesses with >1000 clients
          }catch(e){ console.warn('clients load failed', e); }
          // --- Phase 4 · morceau 3 : modèle + devis courant + CPS ---
          api._courantId = {};
          try{
            const { data: tpl } = await api.sb.from('devis_templates').select('*').eq('business_id', b.id).maybeSingle();
            if(tpl) api._applyTemplate(tpl);
            await api._loadDoc('business_id', b.id, 'devis', STATE.devisCourant);
            await api._loadDoc('business_id', b.id, 'cps', null);
            await api._loadHistory('business_id', b.id);
          }catch(e){ console.warn('documents load failed', e); }
          try{ await api._loadCalculators('business', b.id); await api._loadCalcHistory('business', b.id); }catch(e){ console.warn('calculators load failed', e); }
          try{ await api._loadUsage('business', b.id); }catch(e){ console.warn('usage load failed', e); }
        }
      } else if(role === 'particulier'){
        const { data: p } = await api.sb.from('particuliers').select('*').eq('profile_id', u.id).single();
        if(p){
          const rec = STATE.particuliers.find(x=>x.id===p.id) || {};
          Object.assign(rec, normClient({ id:p.id, nom:p.nom, ville:p.ville||'—', businessId:p.business_id||null,
            statut:p.statut, volume:p.volume_bassin||0, plan:p.plan, email:u.email||'' }));
          Object.assign(rec, { stripeStatus:p.stripe_subscription_status||null, stripeCancelAtEnd:!!p.stripe_cancel_at_period_end,
            trialEndsAt:p.trial_ends_at||null, cpsCredits:p.cps_credits||0, manualAccessUntil:p.manual_access_until||null });
          if(!STATE.particuliers.some(x=>x.id===p.id)) STATE.particuliers.unshift(rec);
          STATE.auth.currentParticulierId = p.id;

          // If this particulier is linked to a business, load the business data too
          if(p.business_id){
            try{
              const { data: b } = await api.sb.from('businesses').select('*').eq('id', p.business_id).single();
              if(b){
                const brec = STATE.businesses.find(x=>x.id===b.id) || {};
                Object.assign(brec, { id:b.id, nom:b.nom, ville:b.ville||'—', plan:b.plan, statut:b.statut,
                  inscription:b.inscription, email:b.email||'', telephone:b.telephone||'', adresse:b.adresse||'',
                  ice:b.ice||'', stripeStatus:b.stripe_subscription_status||null, stripeCancelAtEnd:!!b.stripe_cancel_at_period_end,
                  trialEndsAt:b.trial_ends_at||null, cpsCredits:b.cps_credits||0, manualAccessUntil:b.manual_access_until||null });
                if(!STATE.businesses.some(x=>x.id===b.id)) STATE.businesses.unshift(brec);
                api.myBiz = b.id;
              }
            }catch(e){ console.warn('linked business load failed', e); }
          }

          api._courantId = {};
          try{
            await api._loadDoc('particulier_id', p.id, 'devis', STATE.particulierDevisCourant);
            await api._loadHistory('particulier_id', p.id);
          }catch(e){ console.warn('devis load failed', e); }
          try{ await api._loadCalculators('particulier', p.id); await api._loadCalcHistory('particulier', p.id); }catch(e){ console.warn('calculators load failed', e); }
          try{ await api._loadUsage('particulier', p.id); }catch(e){ console.warn('usage load failed', e); }
        }
      } else if(role === 'admin'){
        // --- Phase 4 · morceau 6 : la console admin lit tous les comptes ---
        await api.reloadAdminLists();
      }
      // Plans de référence (quotas / prix) — source de vérité côté base.
      // On superpose les valeurs de la base sur les objets déjà seedés depuis
      // PLAN_DEFAULTS (même forme : priceMAD, quotas{}, billing…), sans changer
      // la structure attendue par le reste de l'app.
      try{
        const { data: plans } = await api.sb.from('plans').select('*');
        (plans||[]).forEach(pl=>{
          const cur = STATE.plans[pl.id] || { id:pl.id, role:pl.role, quotas:{} };
          cur.role = pl.role;
          cur.priceMAD = pl.price_mad;
          cur.pricePeriod = pl.price_period || 'month';
          cur.priceAltMAD = pl.price_alt_mad || null;
          cur.priceAltPeriod = pl.price_alt_period || null;
          cur.customLabel = pl.label || cur.customLabel;
          cur.catalogueWrite = pl.catalogue_write;
          cur.quotas = { cps:pl.quota_cps, devis:pl.quota_devis, entretien:pl.quota_entretien,
            chauffage:pl.quota_chauffage, hydraulique:(pl.quota_hydraulique!=null?pl.quota_hydraulique:pl.quota_chauffage),
            regulateur:pl.quota_regulateur, electrolyseur:pl.quota_electrolyseur };
          STATE.plans[pl.id] = cur;
        });
      }catch(e){ /* garde les plans par défaut si la table n'est pas lisible */ }

      // --- Phase 4 · morceau 1 : catalogue + catégories ---
      // L'admin gère le catalogue CENTRAL (added_by_business_id = null). Un
      // Business/Business Pro ne voit que SON catalogue (RLS + filtre ci-dessous) ;
      // les plans CPS/Propriétaire/Installateur voient le catalogue central.
      try{
        let q = api.sb.from('catalogue_produits').select('*');
        if(role === 'admin') q = q.is('added_by_business_id', null);
        const [{ data: cats }, { data: prods }] = await Promise.all([
          api.sb.from('catalogue_categories').select('nom'),
          q,
        ]);
        if(Array.isArray(cats) && Array.isArray(prods)){
          const catOwner = role==='admin' ? null : api.myBiz;   // "à qui appartient un produit modifiable"
          STATE.categories = cats.map(c=>c.nom);
          STATE.catalogue = prods.map(p=>({
            id:p.id, key:p.key||null, nom:p.nom, cat:p.categorie, unite:p.unite||'u',
            prix:Number(p.prix)||0, description:p.description||'', fiche:p.fiche||null,
            ownerBiz: p.added_by_business_id || null,
          }));
          const hash = {};
          STATE.catalogue.forEach(c=>{
            if(c.ownerBiz===catOwner) hash[c.id] = JSON.stringify({ nom:c.nom, categorie:c.cat, unite:c.unite||'u',
              prix:Number(c.prix)||0, description:c.description||null, fiche:c.fiche||null, added_by_business_id:catOwner, key:c.key||null });
          });
          api._catOwner = catOwner;
          api._catSnapshot = { cats:new Set(STATE.categories), hash,
            prods:new Set(STATE.catalogue.filter(c=>c.ownerBiz===catOwner).map(c=>c.id)) };
        }
      }catch(e){ console.warn('catalogue load failed', e); }
      return true;
    },
    // Pousse l'identité éditable du compte (nom, ville, plan reste géré par Stripe).
    pushSoon(){
      clearTimeout(api._timer);
      api._timer = setTimeout(api.flush, 1200);
    },
    async flush(){
      if(!api.on || !api.uid || !STATE.auth.loggedIn) return;
      if(api._flushing){ api._flushAgain = true; return; }   // évite deux synchros en parallèle
      api._flushing = true;
      try{ await api._doFlush(); }
      finally{
        api._flushing = false;
        if(api._flushAgain){ api._flushAgain = false; api.pushSoon(); }
      }

    // supabase-js ne "throw" pas : il renvoie { data, error }. Ce helper rend
    // l'erreur visible (console + api._lastError) au lieu de l'avaler.
    _chk(res, label){
      if(res && res.error){
        api._lastError = '['+label+'] ' + (res.error.message || res.error.hint || JSON.stringify(res.error));
        console.error('backend ' + label + ' →', res.error);
      }
      return res ? res.data : null;
    },
    async _doFlush(){
      api._lastError = null;
      api._reRender = false;   // passé à true quand un id local est remplacé par l'id base -> il faut re-render
      if(STATE.auth.adminTestActive) return;   // "Tester l'accès à ce plan" = aperçu, aucune écriture
      try{
        if(STATE.role === 'business'){
          const b = STATE.businesses.find(x=>x.id===STATE.auth.currentBusinessId);
          if(b) api._chk(await api.sb.from('businesses').update({ nom:b.nom, ville:b.ville, adresse:b.adresse||null, telephone:b.telephone||null, ice:b.ice||null }).eq('profile_id', api.uid), 'businesses.update');
        } else if(STATE.role === 'particulier'){
          const p = STATE.particuliers.find(x=>x.id===STATE.auth.currentParticulierId);
          // Verify particulier belongs to current user before updating
          if(p && p.id === STATE.auth.currentParticulierId) api._chk(await api.sb.from('particuliers').update({ nom:p.nom, ville:p.ville, volume_bassin:p.volume||0 }).eq('profile_id', api.uid), 'particuliers.self.update');
        }
        await api.syncCatalogue();
        await api.syncClients();
        await api.syncDocs();
        await api.syncCalculators();
      }catch(e){ console.error('backend flush crashed', e); api._lastError = String(e && e.message || e); }
      // Un enregistrement vient de recevoir son id définitif : on redessine pour
      // que le DOM (data-id) pointe sur le bon id, sinon l'édition suivante est perdue.
      if(api._reRender){ api._reRender = false; try{ render(); }catch(e){} }

    _calcMap(){ return { etude:'bassinParticulier', entretien:'entretienForm',

    async _loadCalculators(ot, oid){
      const rows = api._chk(await api.sb.from('calculateurs').select('*').eq('owner_type', ot).eq('owner_id', oid), 'calculateurs.load');
      const map = api._calcMap();
      (rows||[]).forEach(r=>{
        const key = map[r.kind];
        if(key && r.data && typeof r.data === 'object'){
          STATE[key] = Object.assign(STATE[key] || {}, r.data);
        }
      });

    async syncCalculators(){
      const ot = STATE.role==='business' ? 'business' : STATE.role==='particulier' ? 'particulier' : null;
      if(!ot) return;
      const oid = ot==='business' ? api.myBiz : STATE.auth.currentParticulierId;
      if(!oid) return;
      const map = api._calcMap();
      const rows = [];
      for(const kind in map){
        const data = STATE[map[kind]];
        if(data && typeof data === 'object') rows.push({ owner_type:ot, owner_id:oid, kind, data, updated_at:new Date().toISOString() });
      }
      if(rows.length) api._chk(await api.sb.from('calculateurs').upsert(rows, { onConflict:'owner_type,owner_id,kind' }), 'calculateurs.upsert');

    async consumeQuota(role, ownerId, cat, localUsage){
      if(!api.on) return;
      if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(ownerId))) return; // compte de démo / test local
      const ot = role==='business' ? 'business' : 'particulier';
      try{
        const { data, error } = await api.sb.rpc('consume_quota', { p_owner_type:ot, p_owner_id:ownerId, p_category:cat });
        if(error){ api._lastError = '[consume_quota] '+error.message; console.error('consume_quota', error); return; }
        if(data === true){
          // Server confirmed consumption - now increment client-side
          if(localUsage) localUsage[cat] = (localUsage[cat]||0) + 1;
          saveState(); render();
        } else {
          // Server rejected (quota exceeded)
          showNotification(t('quota.serverfull'), 'warning');
          render();
        }
      }catch(e){ console.error('consumeQuota', e); }
    },

      });
      rec.stripeStatus = p.stripe_subscription_status||null;

    },
    // Écrit vers Supabase les fiches clients de ce Business.
    async syncClients(){

      try{

          }
        }
        const live = new Set(STATE.particuliers.map(c=>c.id));
        const removed = [...snap].filter(id=>!live.has(id));
        if(removed.length) await api.sb.from('particuliers').delete().in('id', removed);
        api._clientSnap = new Set(STATE.particuliers.map(c=>c.id));
      }catch(e){ console.warn('clients sync failed', e); }
    },
    // Écrit vers Supabase les catégories et les produits QUE CE COMPTE possède.
    // Le catalogue central (ownerBiz === null, géré par l'admin) reste en lecture
    // seule ici — les policies RLS le garantissent de toute façon.
    async syncCatalogue(){
      const snap = api._catSnapshot; if(!snap) return;
      const owner = api._catOwner === undefined ? api.myBiz : api._catOwner;  // null pour l'admin (central)
      const bizPlan = (STATE.businesses.find(b=>b.id===api.myBiz)||{}).plan;
      const canWrite = STATE.role==='admin' || !!((STATE.plans[bizPlan]||{}).catalogueWrite);
      const isUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s));
      try{
        // Catégories : taxonomie partagée, gérée par l'admin uniquement.
        if(STATE.role==='admin'){
          const nowCats = new Set(STATE.categories);
          const addedCats = [...nowCats].filter(n=>!snap.cats.has(n));
          const removedCats = [...snap.cats].filter(n=>!nowCats.has(n));
          if(addedCats.length) await api.sb.from('catalogue_categories').upsert(addedCats.map(nom=>({nom})), {onConflict:'nom'});
          if(removedCats.length) await api.sb.from('catalogue_categories').delete().in('nom', removedCats);
          snap.cats = nowCats;
        }

        if(canWrite){
          snap.hash = snap.hash || {};
          for(const c of STATE.catalogue){
            const mine = c.ownerBiz===owner;
            const isNew = !isUuid(c.id);          // ajouté localement (uid() maison), pas encore en base
            if(!mine && !isNew) continue;         // produit d'un autre propriétaire -> on ne touche pas
            const row = { nom:c.nom, categorie:c.cat, unite:c.unite||'u', prix:Number(c.prix)||0,
              description:c.description||null, fiche:c.fiche||null, added_by_business_id:owner, key:c.key||null };
            const sig = JSON.stringify(row);
            if(isNew){
              const { data: ins } = await api.sb.from('catalogue_produits').insert(row).select('id').single();
              if(ins){ c.id = ins.id; c.ownerBiz = owner; snap.hash[c.id] = sig; api._reRender = true; }
            } else if(snap.hash[c.id] !== sig){   // ne pousse que ce qui a réellement changé
              await api.sb.from('catalogue_produits').update(row).eq('id', c.id);
              snap.hash[c.id] = sig;
            }
          }
          const liveIds = new Set(STATE.catalogue.map(c=>c.id));
          const removed = [...snap.prods].filter(id=>!liveIds.has(id));
          if(removed.length) await api.sb.from('catalogue_produits').delete().in('id', removed);
        }
        snap.prods = new Set(STATE.catalogue.filter(c=>c.ownerBiz===owner).map(c=>c.id));
      }catch(e){ console.warn('catalogue sync failed', e); }
    },
    async signIn(email, password){

    async signUp(email, password, meta){

      // est encore connecté, une inscription avec confirmation d'e-mail ne
      // remplacerait pas sa session -> le nouvel arrivant se retrouverait dans
      // l'espace de l'ancien compte.
      try{ await api.sb.auth.signOut(); }catch(e){}
      api.uid = null; STATE.auth.loggedIn = false;
      const { data, error } = await api.sb.auth.signUp({ email, password, options:{ data: meta } });
      if(error) return { error };
      // Email confirmation OFF -> session présente : on enchaîne. ON -> pas de session.
      if(data.session){ await api.hydrate(data.session); return { ok:true }; }
      return { ok:true, needsEmailConfirm:true };
    },
    async signOut(){ try{ await api.sb.auth.signOut(); }catch(e){} api.uid = null; },
    // --- Phase 5 : paiement Stripe (Edge Functions) ---
    async _fn(name, body){
      try{
        const { data, error } = await api.sb.functions.invoke(name, { body: body || {} });
        if(error){ api._lastError = '['+name+'] '+(error.message||error); return { error: error.message||String(error) }; }
        if(data && data.error){ api._lastError = '['+name+'] '+data.error; return { error: data.error }; }
        return data || {};
      }catch(e){ api._lastError = '['+name+'] '+String(e && e.message || e); return { error: String(e && e.message || e) }; }
    },
    async startCheckout(planId, billing){
      const r = await api._fn('create-checkout', { planId, billing: billing || 'main' });

      const r = await api._fn('create-portal', {});
      if(r.url){ window.location.href = r.url; }
      return r;
    },
  };
  return api;
})();

function applyTheme(){
  const root = document.documentElement;
  if(STATE.theme==='dark') root.setAttribute('data-theme','dark');
  else if(STATE.theme==='light') root.setAttribute('data-theme','light');
  else root.removeAttribute('data-theme');
  root.setAttribute('dir', isRTL()?'rtl':'ltr');
  root.setAttribute('lang', STATE.lang||'fr');
}
function setLang(lang){ if(LANGS.includes(lang)){ STATE.lang = lang; saveState(); render(); } }
function toggleTheme(){
  const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const current = STATE.theme || (sysDark?'dark':'light');
  STATE.theme = current==='dark' ? 'light' : 'dark';
  saveState(); applyTheme(); render();

/* ---------------- Formulas ---------------- */
function computeVolume(f){
  if(f.volumeDirect && parseFloat(f.volumeDirect)>0) return round2(parseFloat(f.volumeDirect));
  const pmin = parseFloat(f.profMin)||0, pmax = parseFloat(f.profMax)||pmin;
  const depth = (pmin+pmax)/2;
  if(f.forme==='ronde'){ const r=(parseFloat(f.diametre)||0)/2; return round2(Math.PI*r*r*depth); }
  return round2((parseFloat(f.longueur)||0)*(parseFloat(f.largeur)||0)*depth);
}
function computeSurface(f){
  if(f.forme==='ronde'){ const r=(parseFloat(f.diametre)||0)/2; return round2(Math.PI*r*r); }
  return round2((parseFloat(f.longueur)||0)*(parseFloat(f.largeur)||0));
}
function computePerimetre(f){
  if(f.forme==='ronde'){ return round2(Math.PI*(parseFloat(f.diametre)||0)); }
  return round2(2*((parseFloat(f.longueur)||0)+(parseFloat(f.largeur)||0)));
}

function runEtude(f){
  const V = computeVolume(f);
  const S = computeSurface(f);
  const perim = computePerimetre(f);
  const duree = clamp(parseFloat(f.dureeFiltration)||8, 1, 24);
  const qReq = duree>0 ? round2(V/duree) : 0;
  // A pool can run several filters / pumps in parallel (large bassins, infinity edges,
  // staged builds): the required flow is split across them, so each unit is sized for
  // its own share and the equipment is quoted in that quantity.
  const nbFiltres = clamp(round0(parseFloat(f.nbFiltres)||1), 1, 10);
  const nbPompes = clamp(round0(parseFloat(f.nbPompes)||1), 1, 10);
  const qParFiltre = round2(qReq/nbFiltres);
  const qParPompe = round2(qReq/nbPompes);
  const filtre = chooseFilter(qParFiltre);
  const pompe = choosePump(qParPompe);
  const multiEquip = nbFiltres>1 || nbPompes>1;

  const tempActuelle = parseFloat(f.tempActuelle)||18;
  const tempCible = parseFloat(f.tempCible)||28;
  const dureeChauffe = clamp(parseFloat(f.dureeChauffe)||24,1,240);
  const couverte = !!f.couverte;
  const deltaT = Math.max(0, tempCible-tempActuelle);
  const facteurPerte = couverte?1.1:1.3;
  const energieKWh = round2(V*deltaT*1.163*facteurPerte);
  const puissanceThermique = dureeChauffe>0? round2(energieKWh/dureeChauffe) : 0;
  const pacElec = round2(puissanceThermique/COP_PAC);
  const rechauffeurElec = puissanceThermique;

  const nbProjecteurs = round0(parseFloat(f.projecteurs)||0);
  const eclairageKW = round2(nbProjecteurs*0.018);

  const totalKW = round2(pompe.kw + rechauffeurElec + eclairageKW);
  const seuilMono = 3.68;
  const courantConseil = f.courant==='tri' ? 'Triphasé (choix confirmé)' : (totalKW>seuilMono ? 'Triphasé conseillé (charge totale élevée)' : 'Monophasé suffisant'); // canonical FR value — see COURANT_CONSEIL_KEY for translated display

  const isDebordement = f.typeBassin==='debordement';
  const nbSkimmers = isDebordement?0:Math.max(1,Math.ceil(S/30));
  const nbBuses = Math.max(2,Math.ceil(V/25));
  const margelle = round1(perim);

  const produits = [];
  produits.push({nom:'Filtre à sable Ø'+filtre.d, key:'filtre-'+filtre.d, qte:nbFiltres, unite:'u'});
  const media = filterMedia(filtre);
  produits.push({nom:'Gravier de quartz 3–5 mm (sac 25kg)', key:'gravier-filtrant', qte:media.gravierSacs*nbFiltres, unite:'sac', detail:media.gravierKg*nbFiltres+' kg'});
  produits.push({nom:'Sable de silice 0,4–0,8 mm (sac 25kg)', key:'sable-filtrant', qte:media.siliceSacs*nbFiltres, unite:'sac', detail:media.siliceKg*nbFiltres+' kg'});
  produits.push({nom:'Pompe de filtration', key:'pompe-filtration', qte:nbPompes, unite:'u', detail:pompe.cv+' CV / '+pompe.kw+' kW'});
  if(multiEquip) produits.push({nom:'Vanne PVC / multivoies', key:'vanne-pvc', qte:Math.max(nbFiltres,nbPompes), unite:'u'});
  if(f.chauffage==='pac') produits.push({nom:'Pompe à chaleur', key:'pompe-a-chaleur', qte:1, unite:'u', detail:round1(puissanceThermique)+' kW therm.'});
  if(f.chauffage==='electrique') produits.push({nom:'Réchauffeur électrique', key:'rechauffeur-electrique', qte:1, unite:'u', detail:round1(rechauffeurElec)+' kW'});
  if(nbProjecteurs>0){ produits.push({nom:'Projecteur LED piscine', key:'projecteur-led', qte:nbProjecteurs, unite:'u'}); produits.push({nom:'Transformateur sécurité 12V', key:'transfo-12v', qte:Math.max(1,Math.ceil(nbProjecteurs/3)), unite:'u'}); }
  produits.push({nom:'Buse de refoulement', key:'buse-refoulement', qte:nbBuses, unite:'u'});
  if(!isDebordement) produits.push({nom:'Skimmer', key:'skimmer', qte:nbSkimmers, unite:'u'});
  produits.push({nom:'Bonde de fond', key:'bonde-fond', qte: isDebordement?2:1, unite:'u'});
  produits.push({nom:'Prise balai', key:'prise-balai', qte:1, unite:'u'});

  return {V,S,perim,duree,qReq,filtre,pompe,media,nbFiltres,nbPompes,qParFiltre,qParPompe,multiEquip,
    tempActuelle,tempCible,deltaT,dureeChauffe,couverte,energieKWh,
    puissanceThermique,pacElec,rechauffeurElec,nbProjecteurs,eclairageKW,totalKW,courantConseil,
    isDebordement,nbSkimmers,nbBuses,margelle,produits,input:f};
}

function runEntretien(f){
  const V = parseFloat(f.volume)||0;
  const ph = parseFloat(f.ph);
  const chlore = parseFloat(f.chlore);
  // Water colour: clair (clear) = no algae issue, jaune (yellowish) = early algae,
  // vert (green) = algae bloom — each severity gets its own anti-algue/floculant dose.
  const couleur = ['clair','jaune','vert'].includes(f.couleur) ? f.couleur : 'clair';

  let phAction='ok', phProduit=null, phProduitKey=null, phQty=0;
  if(isFinite(ph)){
    if(ph < 7.4){ phAction='bas'; phProduit='pH plus (kg)'; phProduitKey='ph-plus'; phQty = round2(V*0.015*((7.4-ph)/0.1)); }
    else if(ph > 7.8){ phAction='haut'; phProduit='pH moins (kg)'; phProduitKey='ph-moins'; phQty = round2(V*0.020*((ph-7.8)/0.1)); }
  }

  let clAction='ok', clProduit=null, clProduitKey=null, clQty=0;
  if(isFinite(chlore)){
    if(chlore < 1){ clAction='choc'; clProduit='Chlore choc (kg)'; clProduitKey='chlore-choc'; clQty = round2(V*(1.5-chlore)*0.003); }
    else if(chlore <= 2){ clAction='entretien'; clProduit='Galets chlore lent (kg)'; clProduitKey='galets-chlore'; clQty = round2(V/35); }
    else { clAction='eleve'; }
  }

  const produits=[];
  if(phQty>0) produits.push({nom:phProduit, key:phProduitKey, qte:phQty, unite:'kg'});
  if(clQty>0) produits.push({nom:clProduit, key:clProduitKey, qte:clQty, unite:'kg'});
  const intensite = couleur==='vert' ? 2 : couleur==='jaune' ? 1 : 0;
  if(intensite>0 && V>0){
    produits.push({nom:'Anti-algue (L)', key:'anti-algue', qte:round2(V/50*intensite), unite:'L'});
    produits.push({nom:'Floculant (L)', key:'floculant', qte:round2(V/50*intensite), unite:'L'});
  }
  const materiel = [
    {nom:'Brosse de bassin', key:'brosse-bassin'},
    {nom:'Épuisette', key:'epuisette'},
    {nom:'Perche télescopique', key:'perche-telescopique'},
    {nom:'Trousse d\'analyse (pH/Chlore)', key:'trousse-analyse'},
  ];

  return {V,ph,chlore,couleur,phAction,phProduit,phQty,clAction,clProduit,clQty,produits,materiel,input:f};
}

function runHydraulique(f){
  const distance = parseFloat(f.distance)||8;
  const filtreD = parseInt(f.filtreD)||600;
  const pac = !!f.pac;
  const nbLignes = 4;
  const tubeTotal = round0(nbLignes*distance);
  const vannes = nbLignes + (pac?1:0);
  const unions = 8;
  const coudes = Math.max(4, round0(tubeTotal/3));
  const clapets = pac?1:0;
  const colliers = Math.max(4, round0(tubeTotal/1.5));
  const diametreTuyau = filtreD<=600?50:(filtreD<=900?63:90);
  const produits=[
    {nom:'Tube PVC pression Ø'+diametreTuyau, key:'tube-pvc-'+diametreTuyau, qte:tubeTotal, unite:'m'},
    {nom:'Vanne PVC / multivoies', key:'vanne-pvc', qte:vannes, unite:'u'},
    {nom:'Raccord union PVC', key:'raccord-union', qte:unions, unite:'u'},
    {nom:'Coude PVC 90°', key:'coude-pvc', qte:coudes, unite:'u'},
    {nom:'Collier de fixation', key:'collier-fixation', qte:colliers, unite:'u'},
  ];
  if(clapets>0) produits.push({nom:'Clapet anti-retour', key:'clapet-anti-retour', qte:clapets, unite:'u'});
  return {distance,filtreD,pac,nbLignes,tubeTotal,vannes,unions,coudes,clapets,colliers,diametreTuyau,produits,input:f};
}

function runSterilisation(f){
  // The sterilization item proposes pH regulation, Chlorine regulation and salt electrolysis
  // together. A combined pH/Chlore station is sized alongside as an opt-in alternative to the
  // two separate regulators, for installers who prefer a single device.
  const V = parseFloat(f.volume)||0;
  const regulateurPh = pickTier(V, REGULATEURS_PH);
  const regulateurCl = pickTier(V, REGULATEURS_CL);
  const regulateurPhCl = pickTier(V, REGULATEURS_PH_CL);
  const electrolyseur = pickTier(V, ELECTROLYSEURS);
  const selKg = round0(V*4);
  const sacs = Math.ceil(selKg/25);
  const prodGh = round1(V*0.4);
  const produits=[
    {nom:'Régulateur pH', key:'regulateur-ph', qte:1, unite:'u'},
    {nom:'Régulateur Chlore', key:'regulateur-chlore', qte:1, unite:'u'},
    {nom:'Régulateur pH/Chlore', key:'regulateur-ph-chlore', qte:1, unite:'u', checked:false},
    {nom:'Électrolyseur au sel', key:'electrolyseur-sel', qte:1, unite:'u'},
    {nom:'Sel piscine (sac 25kg)', key:'sel-piscine', qte:sacs, unite:'sac'},
  ];
  return {V,regulateurPh,regulateurCl,regulateurPhCl,electrolyseur,selKg,sacs,prodGh,produits,input:f};
}

/* ---------------- Devis helpers ---------------- */
// Products generated by the calculators (Étude, Entretien, Hydraulique, Stérilisation)
// carry a stable `key` matching the catalogue seed entry they refer to (e.g. 'filtre-400').
// Looking up by key first — falling back to a name match only when no key is given or
// found — means renaming a catalogue product (a feature the business can use) never
// silently breaks pricing for a line the calculators already know how to generate.
function findCatalogEntry(nom, key){
  if(key){ const byKey = STATE.catalogue.find(c=>c.key===key); if(byKey) return byKey; }
  return STATE.catalogue.find(c=>c.nom.toLowerCase()===String(nom).toLowerCase());
}
function catalogPrice(nom, key){ const c = findCatalogEntry(nom, key); return c? c.prix : 0; }
function devisCourantFor(role){ return role==='particulier' ? STATE.particulierDevisCourant : STATE.devisCourant; }

/* ---- Historique des devis / CPS ---- */
// Incrémente la partie numérique finale d'un numéro : DEV-2026-0007 -> DEV-2026-0008
function nextDocNumero(cur){
  const s = String(cur||'').trim();
  const m = s.match(/^(.*?)(\d+)(\D*)$/);
  if(!m) return s ? s+'-2' : '';
  const width = m[2].length;
  return m[1] + String(parseInt(m[2],10)+1).padStart(width,'0') + m[3];
}
function docHistItems(role){ return STATE.devisHistory.filter(h=> h.type==='devis' && (role==='particulier'? h.scope==='particulier' : h.scope!=='particulier')); }
function cpsHistItems(){ return STATE.devisHistory.filter(h=> h.type==='cps'); }
function histTotalTTC(h){
  const ht = (h.items||[]).reduce((s,it)=> s + (parseFloat(it.qte)||0)*(parseFloat(it.prix)||0), 0);
  const net = ht * (1 - (parseFloat(h.remisePct)||0)/100);
  return net * (1 + (parseFloat(h.tva)||0)/100);
}
// Fige le brouillon courant en une entrée d'historique datée, puis repart d'un brouillon vierge numéroté à la suite.
function saveDevisToHistory(role){
  const d = devisCourantFor(role), tpl = STATE.devisTemplate;
  if(!d.items || !d.items.length) return false;
  const entry = { id:uid(), type:'devis', scope: role==='particulier'?'particulier':'business',
    numero:d.numero, client:d.client||'', date:d.date, savedAt:new Date().toISOString(),
    items:JSON.parse(JSON.stringify(d.items)), remisePct:parseFloat(d.remisePct)||0,
    tva:parseFloat(tpl.tva)||0, devise:tpl.devise||'MAD', entete:tpl.entete||'' };
  STATE.devisHistory.unshift(entry);
  d.numero = nextDocNumero(d.numero);
  d.items = []; d.client = ''; d.remisePct = 0;
  if(BACKEND.on) BACKEND.saveHistoryEntry(entry);
  saveState(); return true;
}
function saveCpsToHistory(){
  const cf = STATE.cpsForm, d = STATE.devisCourant;
  const entry = { id:uid(), type:'cps', scope:'business', numero:cf.numero, client:d.client||'',
    date:new Date().toISOString().slice(0,10), savedAt:new Date().toISOString(),
    cps: JSON.parse(JSON.stringify(cf)) };
  STATE.devisHistory.unshift(entry);
  cf.numero = nextDocNumero(cf.numero);
  if(BACKEND.on) BACKEND.saveHistoryEntry(entry);
  saveState(); return true;
}
function openDocFromHistory(id, role){
  const h = STATE.devisHistory.find(x=>x.id===id); if(!h) return;
  if(h.type==='cps'){
    Object.assign(STATE.cpsForm, JSON.parse(JSON.stringify(h.cps||{})));
    STATE.devisTab = 'cps';
  } else {
    const d = devisCourantFor(role);
    d.numero = h.numero; d.client = h.client||''; d.date = h.date;
    d.remisePct = h.remisePct||0;
    d.items = JSON.parse(JSON.stringify(h.items||[]));
    STATE.devisTemplate.tva = h.tva!=null? h.tva : STATE.devisTemplate.tva;
    STATE.devisTemplate.devise = h.devise || STATE.devisTemplate.devise;
    STATE.devisTab = 'devis';

}
function deleteDocFromHistory(id){
  const h = STATE.devisHistory.find(x=>x.id===id);
  const dbId = h && (h.dbId || h.id);
  STATE.devisHistory = STATE.devisHistory.filter(x=>x.id!==id);
  if(BACKEND.on) BACKEND.deleteHistoryEntry(dbId);
  saveState(); render();
}

/* ---- Calculs enregistrés (étude / entretien / hydraulique / stérilisation) ---- */
const CALC_KIND_STATE = { etude:'bassinParticulier', entretien:'entretienForm', hydraulique:'hydrauliqueForm', sterilisation:'sterilisationForm' };
// Le quota est consommé au moment où l'utilisateur VALIDE (enregistre) un calcul,
// pas à l'ajout au devis ni à l'impression. Hydraulique n'a pas de catégorie dédiée.
const CALC_QUOTA = { etude:['chauffage'], entretien:['entretien'], hydraulique:['hydraulique'], sterilisation:['regulateur','electrolyseur'] };
function calcFormFor(kind){ return STATE[CALC_KIND_STATE[kind]]; }
function calcResultOf(kind){ return (STATE.calcResult||{})[kind] || null; }
function calcIsValidated(kind){ return !!calcResultOf(kind); }
function calcHistItems(kind, role){
  const scope = role==='particulier' ? 'particulier' : 'business';
  return STATE.calcHistory.filter(h=> h.kind===kind && (h.scope||'business')===scope);
}
// "Valider" : consomme le quota, fige le résultat, et enregistre une copie datée.
function validateCalc(kind, role, repere){
  const cats = CALC_QUOTA[kind] || [];
  for(const c of cats){ if(!tryConsume(role, c)){ render(); return false; } }
  const form = calcFormFor(kind); if(!form){ return false; }
  const snap = JSON.parse(JSON.stringify(form));
  STATE.calcResult[kind] = snap;
  const entry = { id:uid(), kind, scope: role==='particulier'?'particulier':'business',
    repere:(repere||'').trim(), date:new Date().toISOString().slice(0,10),
    savedAt:new Date().toISOString(), data: snap };
  STATE.calcHistory.unshift(entry);
  if(BACKEND.on) BACKEND.saveCalcEntry(entry);
  saveState(); return true;
}
function openCalcFromHistory(id){
  const h = STATE.calcHistory.find(x=>x.id===id); if(!h) return;
  const key = CALC_KIND_STATE[h.kind];
  if(key){
    STATE[key] = JSON.parse(JSON.stringify(h.data||{}));
    STATE.calcResult[h.kind] = JSON.parse(JSON.stringify(h.data||{}));   // résultat déjà validé
    saveState(); render();
  }
}
function deleteCalcFromHistory(id){
  const h = STATE.calcHistory.find(x=>x.id===id);
  const dbId = h && (h.dbId || h.id);
  STATE.calcHistory = STATE.calcHistory.filter(x=>x.id!==id);
  if(BACKEND.on) BACKEND.deleteCalcEntry(dbId);
  saveState(); render();
}
// Le contrôle "Valider" — placé sous le formulaire. Consomme le quota, fige le
// résultat et enregistre une copie datée.
function renderCalcValidate(kind, role){
  const cats = CALC_QUOTA[kind] || [];
  const rows = cats.map(c=>({q:quotaOf(role,c), r:quotaRemaining(role,c)}));
  if(cats.length && rows.some(x=>x.q===0)) return `<div class="callout warn" style="margin-top:14px;">${ic('i-info')}<div>${t('quota.notincluded')}</div></div>`;
  if(cats.length && rows.some(x=>x.r<=0)) return `<div class="callout danger" style="margin-top:14px;">${ic('i-info')}<div>${t('quota.exhausted')}</div></div>`;
  const label = calcIsValidated(kind) ? t('calc.revalidate') : t('calc.validate');
  const quotaHint = !cats.length ? '' : (rows.every(x=>quotaUnlimited(x.q))
    ? `<div class="hint" style="display:block;margin-top:6px;">${t('quota.unlimited')}</div>`
    : `<div class="hint" style="display:block;margin-top:6px;">${tf('quota.remaining',{n:Math.min(...rows.map(x=>x.r)), quota:Math.min(...rows.map(x=>x.q))})}</div>`);
  return `<div class="card" style="margin-top:14px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="flex:1;min-width:160px;"><label>${t('calc.hist.repere')}</label>
        <input class="input" id="calc-hist-repere" placeholder="${t('calc.hist.repere.ph')}"></div>
      <button class="btn btn-primary" data-action="validate-calc" data-kind="${kind}">${ic('i-check')} ${label}</button>
    </div>${quotaHint}
  </div>`;
}
// Placeholder affiché à la place des résultats tant que le calcul n'est pas validé.
function calcResultPlaceholder(){
  return `<div class="card" style="text-align:center;padding:44px 24px;color:var(--text-muted);align-self:flex-start;">
    ${ic('i-gauge')}<div style="margin-top:10px;font-size:13.5px;line-height:1.5;">${t('calc.notvalidated')}</div>
  </div>`;
}
function renderCalcHistory(kind, role){
  const all = calcHistItems(kind, role);
  const q = (calcHistFilter[kind]||'').toLowerCase().trim();
  const filtered = q ? all.filter(h => (h.repere||'').toLowerCase().includes(q) || String(h.date||'').includes(q)) : all;
  const CAP = 50;
  const list = filtered.slice(0, CAP);
  const search = all.length >= 6 ? `<div class="field" style="max-width:340px;margin-bottom:10px;">
      <input class="input" id="calc-hist-filter" value="${esc(calcHistFilter[kind]||'')}" placeholder="${t('hist.search.ph')}">
      <div class="help">${tf('hist.search.count',{n:filtered.length, total:all.length})}</div></div>` : '';
  return `
  <div class="section-head" style="margin-top:24px;"><h2 style="font-size:15px;">${t('calc.hist.title.'+kind)}</h2></div>
  ${search}
  ${all.length? (filtered.length? `<div class="table-wrap"><table>
      <thead><tr><th>${t('calc.hist.repere')}</th><th>${t('devis.date')}</th><th></th></tr></thead>
      <tbody>${list.map(h=>`<tr>
        <td>${esc(h.repere)||'—'}</td><td class="mono">${esc(h.date)}</td>
        <td style="text-align:end;white-space:nowrap;">
          <button class="btn btn-sm btn-ghost" data-action="open-calc-hist" data-id="${h.id}">${ic('i-file')} ${t('doc.hist.open')}</button>
          <button class="btn btn-sm btn-ghost" data-action="del-calc-hist" data-id="${h.id}" title="${t('action.delete')}" style="color:var(--danger);">${ic('i-trash')}</button>
        </td></tr>`).join('')}</tbody>
    </table></div>${filtered.length>CAP? `<div class="help" style="margin-top:8px;">${tf('hist.search.more',{n:filtered.length-CAP})}</div>`:''}` : `<div class="empty">${t('hist.search.none')}</div>`) : `<div class="empty">${t('calc.hist.empty')}</div>`}
  `;
}
function bindCalcHistory(kind, role){
  const sb = $('[data-action="validate-calc"]');
  if(sb) sb.addEventListener('click', ()=>{
    const rep = ($('#calc-hist-repere')||{}).value||'';
    if(validateCalc(kind, role, rep)) render();
  });
  $$('[data-action="open-calc-hist"]').forEach(b=> b.addEventListener('click', ()=>{ if(confirm(t('calc.hist.confirmopen'))) openCalcFromHistory(b.dataset.id); }));
  $$('[data-action="del-calc-hist"]').forEach(b=> b.addEventListener('click', ()=>{ if(confirm(t('doc.hist.confirmdel'))) deleteCalcFromHistory(b.dataset.id); }));
  const fi = $('#calc-hist-filter');
  if(fi) fi.addEventListener('input', ()=>{ calcHistFilter[kind] = fi.value; render(); });
}

function addItemsToDevis(items, role){
  const target = devisCourantFor(role);
  items.forEach(it=>{
    const existing = target.items.find(x=> (it.key && x.key===it.key) || (!it.key && !x.key && x.nom===it.nom));
    if(existing){ existing.qte = round2((parseFloat(existing.qte)||0) + (parseFloat(it.qte)||0)); }
    else target.items.push({id:uid(), key:it.key||null, nom:it.nom, qte:round2(it.qte), unite:it.unite, prix:catalogPrice(it.nom, it.key)});
  });
  saveState();
}

/* ---------------- Render: shell ---------------- */
/* Preserve keyboard focus & cursor position across full re-renders, so typing
   into any field (a full DOM replace happens on every keystroke) doesn't drop
   focus after the first character. */
function buildStableSelector(el){
  if(!el || !el.tagName) return null;
  if(el.id) return '#'+CSS.escape(el.id);
  let sel = el.tagName.toLowerCase();
  Array.from(el.classList||[]).forEach(c=> sel += '.'+CSS.escape(c));
  ['k','id','nom','cat','tab','scope','i'].forEach(attr=>{
    if(el.dataset && el.dataset[attr]!==undefined) sel += `[data-${attr}="${CSS.escape(el.dataset[attr])}"]`;
  });
  if(el.type==='checkbox' || el.type==='radio') sel += `[value="${CSS.escape(el.value)}"]`;
  return sel;
}
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.matches || !el.matches('input,select,textarea')) return null;
  const sel = buildStableSelector(el);
  if(!sel) return null;
  let selStart=null, selEnd=null;
  try{ selStart=el.selectionStart; selEnd=el.selectionEnd; }catch(e){}
  return {sel, selStart, selEnd};
}
function restoreFocus(info){
  if(!info) return;
  let el;
  try{ el = document.querySelector(info.sel); }catch(e){ return; }
  if(!el) return;
  el.focus();
  if(info.selStart!=null){ try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){} }
}

// Vidéo de fond du hero : apparait en fondu quand elle est prête, se coupe si
// le fichier est absent (les caustiques CSS restent) ou si l'utilisateur a
// désactivé les animations.
function aqInitHeroVideo(){
  const v = $('.aq-hero-video'); if(!v) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){ try{ v.pause(); }catch(e){} v.remove(); return; }
  let done = false;
  const show = ()=>{ done = true; v.classList.add('ready'); };
  const drop = ()=>{ if(!done){ done = true; try{ v.remove(); }catch(e){} } };
  if(v.readyState >= 3) show();
  v.addEventListener('canplay', show, {once:true});
  v.addEventListener('loadeddata', ()=>{ if(v.readyState>=2) show(); }, {once:true});
  v.addEventListener('error', drop, {once:true});
  // pas de source lisible après 5 s -> on retire (les caustiques CSS suffisent)
  setTimeout(()=>{ if(!done) drop(); }, 5000);
  // certains navigateurs bloquent l'autoplay tant qu'on n'a pas appelé play()
  const p = v.play(); if(p && p.catch) p.catch(()=>{});
}
// Révélation au scroll (léger, sans dépendance).
function aqObserveReveal(){
  const els = $$('.aq-reveal');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(el=>el.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {rootMargin:'0px 0px -8% 0px', threshold:0.06});
  els.forEach(el=>io.observe(el));
}

        alert(t('password.reset.sent'));
      } else {
        alert(t('password.reset.unavailable'));
      }
    } else {
      // In local mode: allow password reset with security question
      const acc = STATE.auth.accounts.admin.email.toLowerCase()===email? STATE.auth.accounts.admin
               : STATE.auth.accounts.businesses.find(a=>a.email.toLowerCase()===email)

      acc.password = newPassword;
      saveState();
      alert(t('password.reset.success'));

  // Pricing page: choosing a plan sends the visitor straight to signup, that plan

    localStorage.setItem('signup-plan-selection', planId);
    saveState(); render();
  }));
  // Every signup field syncs into signupDraft as the visitor types — unlike other forms in
  // this app, this draft is NOT read back from STATE, because a validation error re-renders
  // the page (to show the error banner) and the form must not lose what was already typed.
  const signupPlanSel = $('#signup-plan');
  if(signupPlanSel) {
    // Ensure dropdown reflects the selected plan (source of truth is STATE.signup.plan)
    const selectedPlan = (STATE.signup && STATE.signup.plan) || signupDraft.plan;
    if(selectedPlan && STATE.plans[selectedPlan]){
      signupPlanSel.value = selectedPlan;
    }
    // On any change, update both STATE.signup and signupDraft
    signupPlanSel.addEventListener('change', ()=>{
      if(!STATE.signup) STATE.signup = {};

    });
  }
  const syncDraft = (id, field)=>{ const el = $('#'+id); if(el) el.addEventListener('input', ()=>{ signupDraft[field] = el.value; }); };
  syncDraft('signup-nom','nom'); syncDraft('signup-ville','ville'); syncDraft('signup-email','email');
  syncDraft('signup-password','password'); syncDraft('signup-password-confirm','passwordConfirm');

  // Real-time password confirmation validation
  const pwdEl = $('#signup-password');
  const pwdConfEl = $('#signup-password-confirm');
  if(pwdEl && pwdConfEl){
    const validatePwd = ()=>{
      if(signupDraft.password && signupDraft.passwordConfirm && signupDraft.password !== signupDraft.passwordConfirm){
        pwdConfEl.style.borderColor = 'var(--danger)';
        pwdConfEl.title = t('signup.error.password.mismatch');
      } else {
        pwdConfEl.style.borderColor = '';

    };
    pwdEl.addEventListener('input', validatePwd);
    pwdConfEl.addEventListener('input', validatePwd);
  }

  const signupBtn = $('[data-action="do-signup"]');

    let planId = (STATE.signup && STATE.signup.plan)
              || localStorage.getItem('signup-plan-selection')
              || (($('#signup-plan') && $('#signup-plan').value) || null)
              || signupDraft.plan;
    let plan = planId ? STATE.plans[planId] : null;

    // Validation finale: le plan doit exister
    if(!plan){ signupError='signup.error.plan'; return render(); }   // ne crée jamais un compte avec une mauvaise formule
    const nom = (signupDraft.nom||'').trim();
    const ville = (signupDraft.ville||'').trim();
    const email = (signupDraft.email||'').trim().toLowerCase();
    const password = signupDraft.password||'';
    const confirm = signupDraft.passwordConfirm||'';
    if(!nom){ signupError='signup.error.nom.required'; return render(); }
    // Improved email validation: check for proper format, not just @ presence
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!email || !emailRegex.test(email)){ signupError='signup.error.email.invalid'; return render(); }
    if(!password || password.length<6){ signupError='signup.error.password.short'; return render(); }
    if(password!==confirm){ signupError='signup.error.password.mismatch'; return render(); }

    if(BACKEND.on){
      signupBtn.disabled = true;
      const res = await BACKEND.signUp(email, password, { role: plan.role, nom, ville, plan: planId });
      signupBtn.disabled = false;
      if(res.error){
        signupError = /registered|exists|already/i.test(res.error.message||'') ? 'signup.error.email.used' : 'signup.error.generic';
        return render();
      }
      signupError = null; loginError = null;
      signupDraft = {plan:null, nom:'', ville:'', email:'', password:'', passwordConfirm:''};
      STATE.signup = null;
      localStorage.removeItem('signup-plan-selection');
      if(res.needsEmailConfirm){ STATE.publicView='login'; loginError=null; backendSignupNotice=true; return render(); }
      saveState(); return render();
    }

    const emailTaken = STATE.auth.accounts.admin.email.toLowerCase()===email
      || STATE.auth.accounts.businesses.some(a=>a.email.toLowerCase()===email)
      || STATE.auth.accounts.particuliers.some(a=>a.email.toLowerCase()===email);
    if(emailTaken){ signupError='signup.error.email.used'; return render(); }

    // Disable button during submission in local mode
    signupBtn.disabled = true;

    STATE.signupPlan = planId;
    const trialEndsAt = new Date(Date.now() + 86400000).toISOString(); // 1 day from now
    if(plan.role==='business'){
      const newId = uid();
      STATE.businesses.push({id:newId, nom, ville: ville||'—', plan:planId, statut:'actif', inscription:new Date().toISOString().slice(0,10), email, telephone:'', adresse:'', ice:'', trialEndsAt});
      STATE.auth.accounts.businesses.push({id:uid(), businessId:newId, email, password});
      STATE.auth.currentBusinessId = newId;
      STATE.role = 'business';
    } else {
      const newId = uid();
      STATE.particuliers.push(normClient({id:newId, nom, ville: ville||'—', businessId:null, statut:'actif', volume:0, plan:planId, email, trialEndsAt}));
      STATE.auth.accounts.particuliers.push({id:uid(), particulierId:newId, email, password});
      STATE.auth.currentParticulierId = newId;
      STATE.role = 'particulier';
    }
    // A fresh account starts from a blank document identity — never the demo company's name / ICE / address.
    const yr = new Date().getFullYear();
    STATE.devisTemplate.societe = nom;
    STATE.devisTemplate.logo = null;
    STATE.devisTemplate.piedDePage = plan.role==='business' ? nom : '';
    STATE.devisCourant = {numero:'DEV-'+yr+'-0001', client:'', date:new Date().toISOString().slice(0,10), items:[], remisePct:0};
    STATE.particulierDevisCourant = {numero:'DEV-'+yr+'-0001', client:nom, date:new Date().toISOString().slice(0,10), items:[], remisePct:0};
    STATE.cpsForm.numero = 'CPS-'+yr+'-0001';
    signupError = null; loginError = null;
    signupDraft = {plan:null, nom:'', ville:'', email:'', password:'', passwordConfirm:''};
    STATE.signup = null;
    localStorage.removeItem('signup-plan-selection'); // Clear backup
    STATE.auth.loggedIn = true;
    STATE.view = plan.role==='admin' ? 'admin.overview' : plan.role==='business' ? 'business.overview' : 'particulier.bassin';
    signupBtn.disabled = false; // Re-enable button after successful signup
    saveState(); render();
  });
}

// Validate checkbox forms to prevent copy-paste sync issues
function validateCheckboxForms(){
  // Validate quantity inputs - ensure they contain valid numbers
  $$('.devis-qte').forEach(qteInput => {
    qteInput.addEventListener('change', ()=>{
      const val = qteInput.value.trim();
      // Ensure it's a valid number
      if(val && isNaN(parseFloat(val))){
        qteInput.value = '1';
        showNotification('Quantité invalide - 1 utilisé par défaut', 'warning');
      }
      // Ensure checkbox is checked if quantity is entered
      const chkNom = qteInput.dataset.nom;
      if(val && parseFloat(val) > 0){
        const chk = $(`.devis-chk[data-nom="${cssEscape(chkNom)}"]`);
        if(chk && !chk.checked) chk.checked = true;
      }
    });
    qteInput.addEventListener('paste', (e)=>{
      e.preventDefault();
      const pastedText = (e.clipboardData || window.clipboardData).getData('text');
      const numOnly = pastedText.replace(/[^\d.]/g, '');
      if(numOnly && !isNaN(parseFloat(numOnly))){
        qteInput.value = parseFloat(numOnly).toString();
        qteInput.dispatchEvent(new Event('change'));
      } else {
        showNotification('Format de nombre invalide', 'warning');
      }
    });
  });

  // Sync checkbox state with quantity
  $$('.devis-chk').forEach(chk => {
    chk.addEventListener('change', ()=>{
      const nom = chk.dataset.nom;
      const qteInput = $(`.devis-qte[data-nom="${cssEscape(nom)}"]`);
      if(qteInput && chk.checked && !qteInput.value){
        qteInput.value = '1';
      }
    });
  });
}

let manualAccessOpenId = null;
// Cellule "Accès" des tableaux admin Business/Particuliers : bouton pour accorder un
// accès manuel (client qui paie en espèces / hors Stripe), badge + révocation une fois actif.
function adminAccessCell(acc, kind){
  const isManual = acc.stripeStatus === 'manual';
  if(isManual){
    const expired = manualAccessExpired(acc);
    const untilLabel = acc.manualAccessUntil ? String(acc.manualAccessUntil).slice(0,10) : t('admin.access.unlimited');
    return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
      <span class="badge ${expired?'bad':'ok'}"><span class="badge-dot"></span>${expired? t('admin.access.expired') : t('admin.access.manual')} · ${esc(untilLabel)}</span>
      <button class="btn btn-sm btn-danger-outline" data-action="manual-revoke" data-kind="${kind}" data-id="${acc.id}">${t('admin.access.revoke')}</button>
    </div>`;
  }
  if(manualAccessOpenId === acc.id){
    return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
      <input type="date" class="input manual-until-input" data-id="${acc.id}" style="padding:5px 8px;font-size:12px;width:140px;" title="${t('admin.access.until.hint')}">
      <button class="btn btn-sm btn-primary" data-action="manual-grant" data-kind="${kind}" data-id="${acc.id}">${t('admin.access.activate')}</button>
      <button class="btn btn-sm btn-ghost" data-action="manual-cancel-form" data-id="${acc.id}">${t('admin.access.cancel')}</button>
    </div>`;
  }
  return `<button class="btn btn-sm" data-action="manual-open" data-kind="${kind}" data-id="${acc.id}">${ic('i-card')} ${t('admin.access.grant')}</button>`;
}
// Branche les boutons de la colonne "Accès" (accorder / révoquer un accès manuel) pour
// un tableau admin donné (business ou particuliers). `push` persiste vers Supabase.
function bindAdminManualAccess(list, push){
  $$('[data-action="manual-open"]').forEach(b=> b.addEventListener('click', ()=>{ manualAccessOpenId = b.dataset.id; render(); }));
  $$('[data-action="manual-cancel-form"]').forEach(b=> b.addEventListener('click', ()=>{ manualAccessOpenId = null; render(); }));
  $$('[data-action="manual-grant"]').forEach(b=> b.addEventListener('click', ()=>{
    const x = list.find(x=>x.id===b.dataset.id); if(!x) return;
    const dateInput = $(`.manual-until-input[data-id="${b.dataset.id}"]`);
    const untilDate = dateInput && dateInput.value ? dateInput.value : '';
    const untilIso = untilDate ? new Date(untilDate+'T23:59:59').toISOString() : null;
    x.stripeStatus = 'manual'; x.manualAccessUntil = untilIso; x.stripeCancelAtEnd = false;
    push(x, { stripe_subscription_status:'manual', manual_access_until:untilIso, stripe_subscription_id:null, stripe_cancel_at_period_end:false });
    manualAccessOpenId = null; saveState(); render();
  }));
  $$('[data-action="manual-revoke"]').forEach(b=> b.addEventListener('click', ()=>{
    if(!confirm(t('admin.access.revoke.confirm'))) return;
    const x = list.find(x=>x.id===b.dataset.id); if(!x) return;
    x.stripeStatus = null; x.manualAccessUntil = null;
    push(x, { stripe_subscription_status:null, manual_access_until:null });
    saveState(); render();
  }));
}

function bindAdminDetail(list, push, dbKeys){

    push(x, { [dbKey]: x[k] });
    saveState(); render();
  }));
}

// Lets the admin instantly preview what a given plan looks like from the inside, without
// logging out or needing a separate real account: finds (or creates) a dedicated, clearly
// flagged test business/particulier account for that plan, switches into it, and remembers
// which account the admin was viewing before so "Retour admin" restores it exactly.
function testPlanAccess(planId){
  const plan = STATE.plans[planId]; if(!plan) return;
  if(!STATE.auth.adminTestActive){
    STATE.auth.adminTestPrevBusinessId = STATE.auth.currentBusinessId;
    STATE.auth.adminTestPrevParticulierId = STATE.auth.currentParticulierId;
    STATE.auth.adminTestActive = true;
  }
  if(plan.role==='business'){
    let acc = STATE.businesses.find(b=>b.isTestAccount && b.plan===planId);
    if(!acc){
      acc = {id:uid(), nom:tf('admin.plans.test.accountname',{plan:planLabel(planId)}), ville:'—', plan:planId, statut:'actif', inscription:new Date().toISOString().slice(0,10), isTestAccount:true};
      STATE.businesses.push(acc);
    }
    STATE.auth.currentBusinessId = acc.id;
    STATE.role = 'business';
    STATE.view = 'business.overview';
  } else {
    let acc = STATE.particuliers.find(p=>p.isTestAccount && p.plan===planId);
    if(!acc){
      acc = {id:uid(), nom:tf('admin.plans.test.accountname',{plan:planLabel(planId)}), ville:'—', businessId:null, statut:'actif', volume:0, plan:planId, isTestAccount:true};
      STATE.particuliers.push(acc);
    }
    STATE.auth.currentParticulierId = acc.id;
    STATE.role = 'particulier';
    STATE.view = 'particulier.bassin';
  }
  saveState(); render();
}
function exitPlanTest(){
  STATE.auth.currentBusinessId = STATE.auth.adminTestPrevBusinessId || 'b1';
  STATE.auth.currentParticulierId = STATE.auth.adminTestPrevParticulierId || 'p1';

}

// Next monthly-renewal date from a subscription start date (dd of the coming month).
function nextRenewalDate(inscription){
  const start = inscription ? new Date(inscription) : new Date();
  const day = start.getDate();
  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), day);
  if(d <= now) d = new Date(now.getFullYear(), now.getMonth()+1, day);
  try{ return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }
  catch(e){ return d.toISOString().slice(0,10); }
}

function bindBusinessClients(){
  const addBtn = $('[data-action="add-client"]'); if(addBtn) addBtn.addEventListener('click', ()=> $('#add-client-form').classList.toggle('hidden'));
  const expBtn = $('[data-action="export-clients"]');
  if(expBtn) expBtn.addEventListener('click', ()=>{
    const rows = STATE.particuliers.filter(p=>p.businessId===currentBusinessId()).map(p=>[
      p.nom, fmtPhone(p.telephone), p.email||'', p.ville||'', p.volume||'', p.statut||'',
      t('pay.'+(['aucun','non','partiel','paye'].includes(p.paiement)?p.paiement:'aucun')), p.montantPaye||0, p.montantTotal||0, p.description||''
    ]);
    downloadCSV('mes-clients-aqualc.csv',
      ['Nom','Téléphone','Email','Ville','Volume (m³)','Statut','Paiement','Montant payé','Montant total','Notes'], rows);
  });
  const saveBtn = $('[data-action="save-client"]');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const nom = $('#nc-nom').value.trim(); if(!nom) return;
    STATE.particuliers.push(normClient({id:uid(), nom, ville:$('#nc-ville').value.trim()||'—', telephone:$('#nc-tel').value.trim(), email:($('#nc-email')?.value||'').trim(), businessId:currentBusinessId(), statut:'actif', volume:parseFloat($('#nc-volume').value)||0}));
    STATE.clientDetailId = STATE.particuliers[STATE.particuliers.length-1].id; // open the new client's card
    // Clear the form after saving
    (['#nc-nom','#nc-ville','#nc-tel','#nc-email','#nc-volume']).forEach(id=>{
      const el = $(id); if(el) el.value = '';
    });
    saveState(); render();
  });
  $$('[data-action="remove-client"]').forEach(b=> b.addEventListener('click', ()=>{
    const p = STATE.particuliers.find(p=>p.id===b.dataset.id);
    if(p && confirm(tf(BACKEND.on? 'confirm.deleteclient' : 'confirm.removeclient',{nom:p.nom}))){
      if(BACKEND.on) STATE.particuliers = STATE.particuliers.filter(x=>x.id!==p.id); // fiche créée par le pro -> suppression
      else { p.businessId=null; p.statut='indépendant'; }
      if(STATE.clientDetailId===p.id) STATE.clientDetailId=null;
      saveState(); render();
    }
  }));

  const ownClient = id => STATE.particuliers.find(p=>p.id===id && p.businessId===currentBusinessId());
  $$('[data-action="client-details"]').forEach(b=> b.addEventListener('click', ()=>{
    STATE.clientDetailId = STATE.clientDetailId===b.dataset.id ? null : b.dataset.id;
    saveState(); render();
  }));
  $$('.cd-text').forEach(inp=> inp.addEventListener('change', ()=>{
    const p = ownClient(inp.dataset.id); if(!p) return;
    const k = inp.dataset.k;
    if(k==='montantPaye' || k==='montantTotal') p[k] = parseFloat(inp.value)||0;
    else if(k==='ville') p.ville = inp.value.trim()||'—';
    else if(k==='nom'){ const v = inp.value.trim(); if(!v){ inp.value = p.nom; return; } p.nom = v; }
    else p[k] = inp.value;
    normClient(p); saveState(); render();
  }));
  $$('[data-action="cd-paiement"]').forEach(b=> b.addEventListener('click', ()=>{
    const p = ownClient(b.dataset.id); if(!p) return;
    p.paiement = b.dataset.v; saveState(); render();
  }));
  $$('[data-action="cd-task-toggle"]').forEach(cb=> cb.addEventListener('change', ()=>{
    const p = ownClient(cb.dataset.id); if(!p) return;
    const x = p.taches.find(x=>x.id===cb.dataset.tid); if(!x) return;
    x.done = cb.checked; x.date = cb.checked ? new Date().toISOString().slice(0,10) : '';
    saveState(); render();
  }));
  $$('[data-action="cd-task-del"]').forEach(b=> b.addEventListener('click', ()=>{
    const p = ownClient(b.dataset.id); if(!p) return;
    p.taches = p.taches.filter(x=>x.id!==b.dataset.tid); saveState(); render();
  }));
  const taskAdd = $('[data-action="cd-task-add"]');
  if(taskAdd) taskAdd.addEventListener('click', ()=>{
    const p = ownClient(taskAdd.dataset.id); if(!p) return;
    const v = ($('#cd-task-input').value||'').trim(); if(!v) return;
    p.taches.push({id:uid(), label:v, done:false, date:''}); saveState(); render();
  });
  $$('[data-action="cd-suivi-del"]').forEach(b=> b.addEventListener('click', ()=>{
    const p = ownClient(b.dataset.id); if(!p) return;
    p.suivi = p.suivi.filter(s=>s.id!==b.dataset.sid); saveState(); render();
  }));
  const suiviAdd = $('[data-action="cd-suivi-add"]');
  if(suiviAdd) suiviAdd.addEventListener('click', ()=>{
    const p = ownClient(suiviAdd.dataset.id); if(!p) return;
    const v = ($('#cd-suivi-input').value||'').trim(); if(!v) return;
    p.suivi.unshift({id:uid(), date:new Date().toISOString().slice(0,10), texte:v}); saveState(); render();
  });
}

            <td style="text-align:end;white-space:nowrap;">

// Import en masse : une ligne = un produit, colonnes séparées par tabulation
// (copier-coller Excel), point-virgule ou virgule : Nom ; Catégorie ; Unité ; Prix ; Description.
function parseCatalogueImport(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows = [];
  lines.forEach((line, i)=>{
    const delim = line.indexOf('\t')>=0 ? '\t' : (line.indexOf(';')>=0 ? ';' : ',');
    const p = line.split(delim).map(s=>s.trim());
    const nom = p[0];
    if(!nom) return;
    if(i===0 && /^(nom|produit|name|désignation|designation|article)$/i.test(nom)) return; // en-tête
    const prix = parseFloat(String(p[3]||'').replace(/\s/g,'').replace(',', '.')) || 0;
    rows.push({ nom, cat:(p[1]||'').trim(), unite:(p[2]||'').trim()||'u', prix, description:(p[4]||'').trim() });
  });
  return rows;
}
// --- Export CSV (séparateur ';' + BOM pour Excel FR ; télécharge un fichier) ---
function csvCell(v){ v = v==null ? '' : String(v); return /[";\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(filename, headers, rows){
  const lines = [headers.map(csvCell).join(';')].concat((rows||[]).map(r=>r.map(csvCell).join(';')));
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function bindCatalogue(){
  const canWrite = canCatalogueWrite(STATE.role==='admin' ? 'admin' : 'business');
  // The product detail panel (description + fiche technique) is viewable by everyone,
  // so its open/close toggle is wired before the read-only early return.
  $$('[data-action="cat-details"]').forEach(b=> b.addEventListener('click', ()=>{
    const opening = STATE.catalogueDetailId!==b.dataset.id;
    STATE.catalogueDetailId = opening ? b.dataset.id : null;
    saveState(); render();
    if(opening){ const p = $('#cat-detail'); if(p) p.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  }));
  const expCat = $('[data-action="export-catalogue"]');
  if(expCat) expCat.addEventListener('click', ()=>{
    downloadCSV('catalogue-aqualc.csv',
      ['Nom','Catégorie','Unité','Prix (MAD)','Description'],
      STATE.catalogue.map(c=>[c.nom, c.cat, c.unite, c.prix, c.description||'']));
  });
  // Filtre par catégorie (visible en lecture seule aussi) : clic sur une puce
  // de catégorie -> n'affiche que ses produits ; "Tous les produits" réinitialise.
  $$('[data-action="filter-cat"]').forEach(el=> el.addEventListener('click', (e)=>{
    e.stopPropagation();
    catalogueFilterCat = el.dataset.cat || '';
    render();
  }));
  if(!canWrite) return; // read-only for plans without catalogue write access — no editing controls to bind
  $$('.cat-price').forEach(inp=> inp.addEventListener('change', ()=>{ const c=STATE.catalogue.find(c=>c.id===inp.dataset.id); if(c){ c.prix=parseFloat(inp.value)||0; saveState(); } }));
  $$('.cat-nom').forEach(inp=> inp.addEventListener('change', ()=>{ const c=STATE.catalogue.find(c=>c.id===inp.dataset.id); if(c && inp.value.trim()){ c.nom=inp.value.trim(); saveState(); render(); } }));
  $$('.cat-unite').forEach(inp=> inp.addEventListener('change', ()=>{ const c=STATE.catalogue.find(c=>c.id===inp.dataset.id); if(c && inp.value.trim()){ c.unite=inp.value.trim(); saveState(); } }));
  $$('.cat-cat').forEach(sel=> sel.addEventListener('change', ()=>{ const c=STATE.catalogue.find(c=>c.id===sel.dataset.id); if(c){ c.cat=sel.value; saveState(); render(); } }));

  const toggleBtn = $('[data-action="toggle-add-product"]'); if(toggleBtn) toggleBtn.addEventListener('click', ()=> $('#add-product-form').classList.toggle('hidden'));
  const saveBtn = $('[data-action="save-product"]');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const nom = $('#np-nom').value.trim(); if(!nom) return;
    const catSel = $('#np-cat'); const cat = catSel.value; if(!cat) return;
    const unite = $('#np-unite').value.trim() || 'u';
    const prix = parseFloat($('#np-prix').value)||0;
    const description = ($('#np-desc').value||'').trim();
    STATE.catalogue.push({id:uid(), nom, cat, unite, prix, description});
    saveState(); render();
  });

  const impToggle = $('[data-action="toggle-import-products"]');
  if(impToggle) impToggle.addEventListener('click', ()=>{ const f=$('#import-product-form'); if(f) f.classList.toggle('hidden'); });
  const impFile = $('#imp-file');
  if(impFile) impFile.addEventListener('change', ()=>{
    const f = impFile.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ const ta=$('#imp-text'); if(ta) ta.value = String(r.result||''); };
    r.readAsText(f);
  });
  const impBtn = $('[data-action="run-import"]');
  if(impBtn) impBtn.addEventListener('click', ()=>{
    const rows = parseCatalogueImport(($('#imp-text')||{}).value || '');
    if(!rows.length){ alert(t('catalogue.import.none')); return; }
    const catWrite = STATE.role==='admin' || !BACKEND.on;
    let added=0, catsCreated=0, skipped=0;
    rows.forEach(row=>{
      let cat = row.cat;
      if(cat){
        const existing = STATE.categories.find(c=>c.toLowerCase()===cat.toLowerCase());
        if(existing) cat = existing;
        else if(catWrite){ STATE.categories.push(cat); catsCreated++; }
        else cat = STATE.categories[0];
      } else cat = STATE.categories[0];
      if(!cat){ skipped++; return; }
      STATE.catalogue.push({ id:uid(), nom:row.nom, cat, unite:row.unite||'u', prix:row.prix||0, description:row.description||'' });
      added++;
    });
    saveState();
    alert(tf('catalogue.import.done',{added, cats:catsCreated, skipped}));
    const ta=$('#imp-text'); if(ta) ta.value='';
    const f=$('#import-product-form'); if(f) f.classList.add('hidden');
    render();
  });
  $$('[data-action="delete-product"]').forEach(b=> b.addEventListener('click', ()=>{
    const c = STATE.catalogue.find(c=>c.id===b.dataset.id);
    if(c && confirm(tf('confirm.deleteproduct',{nom:c.nom}))){ STATE.catalogue = STATE.catalogue.filter(x=>x.id!==b.dataset.id); if(STATE.catalogueDetailId===c.id) STATE.catalogueDetailId=null; saveState(); render(); }
  }));
  $$('.cd-desc').forEach(ta=> ta.addEventListener('change', ()=>{
    const c = STATE.catalogue.find(c=>c.id===ta.dataset.id); if(!c) return;
    c.description = ta.value.trim(); saveState();
  }));
  const ficheInput = $('#cat-fiche-input');
  if(ficheInput) ficheInput.addEventListener('change', ()=>{
    const file = ficheInput.files[0]; if(!file) return;
    const c = STATE.catalogue.find(c=>c.id===ficheInput.dataset.id); if(!c) return;
    if(file.type !== 'application/pdf'){ alert(t('catalogue.fiche.notpdf')); ficheInput.value=''; return; }
    const MAX = 1.5*1024*1024;
    if(file.size > MAX){ alert(tf('catalogue.fiche.toobig',{max:'1,5 Mo'})); ficheInput.value=''; return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const prev = c.fiche;
      c.fiche = {name:file.name, size:file.size, type:file.type, dataUrl:reader.result};
      if(!saveState()){ c.fiche = prev; saveState(); alert(t('catalogue.fiche.quota')); render(); return; }
      render();
    };
    reader.readAsDataURL(file);
  });
  $$('[data-action="cat-fiche-del"]').forEach(b=> b.addEventListener('click', ()=>{
    const c = STATE.catalogue.find(c=>c.id===b.dataset.id); if(!c) return;
    if(ficheDelArm===c.id){ ficheDelArm=null; delete c.fiche; saveState(); render(); }
    else { ficheDelArm=c.id; render(); setTimeout(()=>{ if(ficheDelArm===c.id){ ficheDelArm=null; render(); } }, 4000); }
  }));

  const addCatBtn = $('[data-action="add-category"]');
  const catInput = $('#new-cat-name');
  const doAddCategory = ()=>{
    const name = catInput.value.trim(); if(!name) return;
    if(!STATE.categories.some(c=>c.toLowerCase()===name.toLowerCase())){ STATE.categories.push(name); saveState(); }
    render();
  };
  if(addCatBtn) addCatBtn.addEventListener('click', doAddCategory);
  if(catInput) catInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAddCategory(); } });
  $$('[data-action="delete-category"]').forEach(b=> b.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(b.disabled) return;
    if(!confirm(tf('confirm.deletecategory',{nom:b.dataset.cat}))) return;
    if(catalogueFilterCat===b.dataset.cat) catalogueFilterCat='';
    STATE.categories = STATE.categories.filter(c=>c!==b.dataset.cat); saveState(); render();
  }));
}

  return tf('store.order.cart.msg',{titre:data.t||'', lines, total:fmtMoney(storeCartTotal(items))});

// Autocomplete "Produit" des lignes de devis/CPS : id de la ligne dont la liste de
// suggestions du catalogue est ouverte (ou null si aucune). Une seule à la fois.
let itemAutocompleteId = null;
// Produits du catalogue dont le nom contient `query` (insensible à la casse/accents),
// limité à 8 résultats pour garder la liste courte.
function catalogueMatches(query){
  const q = String(query||'').trim().toLowerCase();
  if(!q) return [];
  return STATE.catalogue.filter(c=> c.nom && c.nom.toLowerCase().includes(q)).slice(0,8);
}
// Liste déroulante affichée sous un champ "Produit" en cours de saisie.
function autocompleteList(itemId, query){
  const matches = catalogueMatches(query);
  if(itemAutocompleteId!==itemId || !matches.length) return '';
  return `<div class="ac-list">${matches.map(c=>`
    <div class="ac-item" data-action="ac-pick" data-id="${itemId}" data-catid="${c.id}">
      <span class="ac-item-nom">${esc(c.nom)}</span>
      <span class="ac-item-meta">${fmt(c.prix)} MAD/${esc(c.unite)}</span>
    </div>`).join('')}</div>`;
}
// Branche la saisie + le clic sur les suggestions pour un tableau de lignes donné.
// `items` est le tableau réel (STATE.devisCourant.items, d.items, cf.articles...)
// afin que la sélection modifie directement les bons objets.
function bindItemAutocomplete(items){
  $$('[data-action="ac-pick"]').forEach(opt=> opt.addEventListener('mousedown', (e)=>{
    e.preventDefault(); // reste sur le champ, sans quoi le clic ferme d'abord la liste (blur)
    const it = items.find(x=>x.id===opt.dataset.id);
    const c = STATE.catalogue.find(x=>x.id===opt.dataset.catid);
    if(it && c){ it.nom = c.nom; it.prix = parseFloat(c.prix)||0; }
    itemAutocompleteId = null;
    saveState(); render();
  }));
  $$('.it-nom').forEach(inp=> inp.addEventListener('keydown', (e)=>{
    if(e.key==='Escape' && itemAutocompleteId===inp.dataset.id){ itemAutocompleteId=null; render(); }
  }));
  positionAutocompleteList();
}
// La liste (position:fixed) doit être positionnée "à la main" sous son champ après
// coup, puisqu'elle est rendue comme une simple chaîne HTML sans coordonnées.
// Recalée aussi contre le bord droit de l'écran pour ne jamais sortir du viewport.
function positionAutocompleteList(){
  const list = document.querySelector('.ac-list');
  if(!list || itemAutocompleteId===null) return;
  const inp = document.querySelector(`.it-nom[data-id="${itemAutocompleteId}"]`);
  if(!inp) return;
  const r = inp.getBoundingClientRect();
  list.style.minWidth = r.width+'px';
  const listWidth = list.getBoundingClientRect().width;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - listWidth - 8));
  list.style.left = left+'px';
  list.style.top = (r.bottom+4)+'px';
}
// Ferme la liste au clic en dehors (installé une seule fois, pas à chaque render).
// Un `blur` sur le champ se serait aussi déclenché en cliquant/glissant la barre de
// défilement DE LA LISTE elle-même — fermant la liste avant même de pouvoir choisir
// un produit. En ne fermant que sur un clic hors de `.ac-wrap` (qui contient le champ
// ET sa liste), on peut la faire défiler librement sans la perdre.
document.addEventListener('mousedown', (e)=>{
  if(itemAutocompleteId===null) return;
  if(e.target.closest && e.target.closest('.ac-wrap')) return;
  itemAutocompleteId = null; render();
}, true);
// La liste est en position:fixed (donc figée à l'écran, pas au champ) : si la page
// défile pendant qu'elle est ouverte, on la referme plutôt que de la laisser dériver
// visuellement loin de son champ. Le défilement DE LA LISTE elle-même est exclu.
window.addEventListener('scroll', (e)=>{
  if(itemAutocompleteId===null) return;
  if(e.target && e.target.closest && e.target.closest('.ac-list')) return;
  itemAutocompleteId = null; render();
}, true);

// Client block for a document: name + (address / city) pulled from the client record when we can match it.
function clientPartyLines(name){
  const c = STATE.particuliers.find(p=>p.businessId===currentBusinessId() && p.nom===name);
  let parts = [];
  if(c){
    const adr = (c.adresse||'').trim();
    const ville = c.ville && c.ville!=='—' ? c.ville : '';
    if(adr) parts.push(adr);
    if(ville && !adr.toLowerCase().includes(ville.toLowerCase())) parts.push(ville);
    if(c.telephone) parts.push(fmtPhone(c.telephone));
  }
  const extra = parts.join(' · ');
  return esc(name) + (extra? `<div style="font-size:10.5px;color:#8698a0;margin-top:2px;">${esc(extra)}</div>` : '');
}

  // Defensive parsing: these fields are kept as raw strings while typing (so a

  const tvaAmount = netHT*tva, ttc = netHT+tvaAmount;

function bindDevis(){
  $$('[data-action="devis-tab"]').forEach(tabEl=> tabEl.addEventListener('click', ()=>{ STATE.devisTab = tabEl.dataset.tab; saveState(); render(); }));
  const printBtn = $('[data-action="print-doc"]');
  if(printBtn) printBtn.addEventListener('click', ()=>{
    const cat = (STATE.devisTab||'devis')==='cps' ? 'cps' : 'devis';
    if(!tryConsume('business', cat)) return render();
    render(); printNow();
  });

  if((STATE.devisTab||'devis')==='cps') bindCps(); else bindDevisTab();
