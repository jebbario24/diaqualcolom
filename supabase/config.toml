# Supabase CLI project config.
# Link this folder to your project once:  supabase link --project-ref celxziugeeojamflcafs
# (the project-ref is the subdomain of your Project URL)

project_id = "aquaaman"

[functions.create-checkout]
verify_jwt = true

[functions.create-portal]
verify_jwt = true

# Stripe signs its own requests; there is no Supabase JWT to verify.
[functions.stripe-webhook]
verify_jwt = false
